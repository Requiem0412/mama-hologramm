<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Hologramm-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    }
    h1 { color: var(--cyan); margin-bottom: 15px; font-size: 24px; }
    p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; color: #d0e8ff; }
    .btn {
      background: var(--cyan);
      color: #030812;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐾 Shiva & Sky Hologramm</h1>
    <p id="msg">Die Verbindung steht! Klicke auf den Button, um den Leckerli-Modus zu starten.</p>
    <button class="btn" id="treat-btn">🦴 Leckerli geben!</button>
  </div>

  <script>
    const btn = document.getElementById('treat-btn');
    const msg = document.getElementById('msg');

    btn.addEventListener('click', () => {
      msg.textContent = 'Juhu! Shiva & Sky wedeln mit dem Schwanz und freuen sich riesig über das Leckerli! 🦴🐾';
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance('Juhu, ein Leckerli!');
        utter.lang = 'de-DE';
        window.speechSynthesis.speak(utter);
      }
    });
  </script>
</body>
</html>
