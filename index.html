<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Hologramm-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --pink: #ff3366;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Scanlines für echten Sci-Fi-Hologramm-Look */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.03) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 20px;
      z-index: 20;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      transition: all 0.3s ease;
    }

    body.is-whining .dot {
      background: var(--pink);
      box-shadow: 0 0 20px var(--pink);
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
    }

    .main-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
      justify-content: center;
      flex: 1;
      z-index: 20;
    }

    /* Freistehende 3-Spalten-Bühne */
    .stage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px;
      width: 100%;
      max-width: 1000px;
      align-items: center;
      text-align: center;
    }

    .holo-entity {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    /* Drahtgitter-Look */
    .wireframe-icon {
      font-size: 64px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 16px var(--cyan));
      transition: transform 0.3s ease;
    }

    /* Augen leuchten pink auf beim Winseln */
    body.is-whining .wireframe-icon {
      transform: translateY(-10px) scale(1.12);
      animation: wagTail 0.15s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 20px var(--pink));
    }

    @keyframes wagTail {
      0% { transform: translateY(-8px) rotate(-3deg); }
      100% { transform: translateY(-12px) rotate(3deg); }
    }

    .entity-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--cyan);
    }

    /* Markierte Gesichtshälften in hellem Grün */
    .shiva-accent {
      color: var(--green);
      text-shadow: 0 0 10px var(--green);
    }

    .sky-accent {
      color: var(--green);
      text-shadow: 0 0 10px var(--green);
    }

    /* Schwebendes Herzchen */
    .heart-badge {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      font-size: 34px;
      filter: drop-shadow(0 0 12px var(--pink));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    body.is-whining .heart-badge {
      transform: translateX(-50%) scale(1.3);
      animation: pulseHeart 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulseHeart {
      0% { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1.4); }
    }

    /* Steuerungs- und Fragefenster */
    .control-card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    p { font-size: 16px; line-height: 1.5; color: #d0e8ff; }

    .action-row {
      display: flex;
      gap: 12px;
    }

    .action-row input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(0, 243, 255, 0.35);
      background: rgba(5, 15, 30, 0.9);
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .action-row input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }

    .treat-btn {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(0, 160, 255, 0.3));
      color: #ffffff;
      border: 2px solid var(--cyan);
      padding: 14px 26px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .treat-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot"></span>
      <span>Shiva & Sky • Hologramm</span>
    </div>
    <div class="status-pill" id="status-text
