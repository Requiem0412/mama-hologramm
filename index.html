<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persönlicher KI-Assistent • 3D Hologramm</title>
  <style>
    :root {
      --cyan: #18e8ff;
      --green: #10ff98;
      --amber: #ffbe3b;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 30%, #0b2447 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.025) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 30;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all 0.3s ease;
    }

    .settings-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #d0e8ff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .settings-toggle:hover {
      background: rgba(0, 243, 255, 0.18);
      border-color: var(--cyan);
    }

    /* 3-Spalten-Bühne: Links Shiva • Mitte 3D-Kopf & Chat • Rechts Sky */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(260px, 1.15fr) minmax(340px, 660px) minmax(260px, 1.15fr);
      align-items: center;
      gap: 12px;
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
      padding: 4px 16px 24px;
      z-index: 20;
    }

    /* Laser-Hologramm Bühne für Shiva & Sky */
    .holo-companion {
      position: relative;
      height: 72vh;
      min-height: 420px;
      max-height: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 46px;
      cursor: pointer;
      user-select: none;
      perspective: 900px;
    }

    .holo-avatar-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-style: preserve-3d;
      animation: holoFloat 4.2s ease-in-out infinite;
    }

    #sky-stage .holo-avatar-wrap {
      animation-delay: -2.1s;
    }

    @keyframes holoFloat {
      0%, 100% { transform: translateY(0px) rotateZ(-0.8deg); }
      50% { transform: translateY(-8px) rotateZ(1deg); }
    }

    .holo-dog-img {
      max-width: 100%;
      max-height: 98%;
      width: auto;
      height: 96%;
      object-fit: contain;
      object-position: bottom center;
      -webkit-mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
      filter:
        drop-shadow(0 0 18px rgba(24, 232, 255, 0.55))
        drop-shadow(0 0 38px rgba(0, 160, 255, 0.25))
        contrast(1.05)
        saturate(1.08);
      transition: filter 0.3s ease;
    }

    #sky-stage .holo-dog-img {
      transform: scale(1.07);
      transform-origin: bottom center;
    }

    .holo-scan-overlay {
      position: absolute;
      inset: 4% 8% 4%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(24, 232, 255, 0.07) 4px
      );
      pointer-events: none;
      border-radius: 40%;
      mix-blend-mode: screen;
    }

    .holo-projector-ring {
      position: absolute;
      bottom: 42px;
      width: 230px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(24, 232, 255, 0.55);
      background: radial-gradient(ellipse at center, rgba(24, 232, 255, 0.28) 0%, transparent 72%);
      box-shadow: 0 0 24px rgba(24, 232, 255, 0.45), inset 0 0 14px rgba(24, 232, 255, 0.35);
      pointer-events: none;
    }

    .pet-tag {
      position: absolute;
      bottom: 4px;
      background: rgba(4, 16, 34, 0.9);
      border: 1px solid rgba(24, 232, 255, 0.45);
      color: #dffbff;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 0 18px rgba(24, 232, 255, 0.25);
    }

    /* Mittlere Spalte: 3D-Kopf oben + Chat unten */
    .center-column {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #canvas-wrap {
      position: relative;
      width: 100%;
      height: 35vh;
      min-height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #holo-canvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 26px rgba(24, 232, 255, 0.45));
    }

    .status-pill {
      position: absolute;
      bottom: 6px;
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(24, 232, 255, 0.45);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: #e6fbff;
      box-shadow: 0 0 20px rgba(24, 232, 255, 0.2);
      text-align: center;
    }

    main {
      width: 100%;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 25;
    }

    .mic-btn {
      width: 100%;
      padding: 18px 24px;
      border-radius: 20px;
      border: 2px solid var(--cyan);
      background: linear-gradient(135deg, rgba(24, 232, 255, 0.22), rgba(0, 110, 255, 0.28));
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 0 30px rgba(24, 232, 255, 0.28);
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .mic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(24, 232, 255, 0.45);
    }

    .mic-btn.listening {
      border-color: var(--green);
      background: linear-gradient(135deg, rgba(16, 255, 152, 0.28), rgba(0, 160, 90, 0.35));
      box-shadow: 0 0 42px rgba(16, 255, 152, 0.5);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .chip {
      background: var(--panel);
      border: 1px solid rgba(24, 232, 255, 0.28);
      color: #dff8ff;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .chip:hover {
      background: rgba(24, 232, 255, 0.16);
      border-color: var(--cyan);
    }

    .answer-card {
      background: var(--panel);
      border: 1px solid rgba(24, 232, 255, 0.4);
      border-radius: 20px;
      padding: 18px;
