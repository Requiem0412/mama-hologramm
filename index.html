<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Hologramm-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --pink: #ff3366;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
    }

    .main-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    }

    h1 { color: var(--cyan); margin-bottom: 15px; font-size: 24px; }
    p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; color: #d0e8ff; }

    .treat-btn {
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.3), rgba(255, 110, 0, 0.4));
      color: #ffffff;
      border: 2px solid var(--amber);
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.3);
      transition: transform 0.2s;
    }

    .treat-btn:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot"></span>
      <span>Shiva & Sky • Hologramm</span>
    </div>
    <div class="status-pill" id="status-text">Bereit</div>
  </header>

  <div class="main-container">
    <div class="card">
      <h1>🐾 Hologramm-Assistent</h1>
      <p id="msg">Die Bühne ist aktiv. Klicke auf den Leckerli-Button, um die Animation zu starten!</p>
      <button class="treat-btn" id="treat-btn">🦴 Leckerli geben!</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('treat-btn');
    const msg = document.getElementById('msg');
    const statusText = document.getElementById('status-text');

    btn.addEventListener('click', () => {
      statusText.textContent = 'Juhu, Leckerli! 💖';
      msg.textContent = 'Shiva & Sky stehen auf, das Herzchen leuchtet, sie wedeln mit dem Schwanz und strecken glücklich die Zunge heraus! 🐕🐾';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance('Juhu, ein Leckerli!');
        utter.lang = 'de-DE';
        window.speechSynthesis.speak(utter);
      }

      setTimeout(() => {
        statusText.textContent = 'Bereit';
        msg.textContent = 'Shiva & Sky sitzen wieder gemütlich.';
      }, 5000);
    });
  </script>
</body>
</html>
