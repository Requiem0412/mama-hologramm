<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • 3D-Wireframe-Hologramm</title>
  <style>
    :root { --cyan: #00f3ff; --green: #00ff88; --pink: #ff3366; --bg: #02060f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 40%, #091d3a 0%, var(--bg) 80%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; padding: 16px 24px; overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,243,255,0.035) 4px);
    }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1500px; width: 100%; margin: 0 auto 8px; }
    .pill {
      background: rgba(0,243,255,0.1); border: 1px solid rgba(0,243,255,0.45);
      padding: 8px 18px; border-radius: 99px; font-weight: 600; font-size: 15px; color: var(--cyan);
      box-shadow: 0 0 18px rgba(0,243,255,0.15);
    }
    .stage {
      flex: 1; display: grid; grid-template-columns: 1.15fr 1fr 1.15fr; gap: 20px;
      max-width: 1540px; width: 100%; margin: auto; align-items: center; text-align: center;
    }
    .entity {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      height: 54vh; min-height: 350px;
    }
    .holo-svg {
      width: 100%; max-width: 400px; height: 100%; max-height: 400px;
      filter: drop-shadow(0 0 12px rgba(0,243,255,0.7)); overflow: visible;
    }
    .head-svg { max-width: 340px; max-height: 350px; animation: floatHead 4s ease-in-out infinite; }
    @keyframes floatHead { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .wire-cyan { fill: rgba(0,243,255,0.06); stroke: var(--cyan); stroke-width: 1.5; stroke-linejoin: round; }
    .wire-fine { fill: none; stroke: rgba(0,243,255,0.42); stroke-width: 0.85; }
    .face-green { fill: rgba(0,255,136,0.22); stroke: var(--green); stroke-width: 1.8; filter: drop-shadow(0 0 8px var(--green)); }
    .face-cyan { fill: rgba(0,243,255,0.08); stroke: var(--cyan); stroke-width: 1.5; }
    .dog-eye { fill: var(--cyan); transition: all 0.25s ease; }
    .dog-tongue { fill: rgba(255,51,102,0.5); stroke: var(--pink); stroke-width: 1.5; opacity: 0; transition: opacity 0.25s ease; }
    .dog-body { transform-origin: 150px 260px; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    body.whine .dog-body { transform: translateY(-22px) scaleY(1.07); }
    body.whine .dog-eye { fill: var(--pink); filter: drop-shadow(0 0 10px var(--pink)); }
    body.whine .dog-tongue { opacity: 1; }
    body.whine .tail-l { animation: wagL 0.14s ease-in-out infinite alternate; }
    body.whine .tail-r { animation: wagR 0.14s ease-in-out infinite alternate; }
    @keyframes wagL { from { transform: rotate(-16deg); } to { transform: rotate(22deg); } }
    @keyframes wagR { from { transform: rotate(16deg); } to { transform: rotate(-22deg); } }
    .heart {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%) scale(0);
      font-size: 44px; filter: drop-shadow(0 0 16px var(--pink)); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 20;
    }
    body.whine .heart { transform: translateX(-50%) scale(1.25); animation: beat 0.55s ease-in-out infinite alternate; }
    @keyframes beat { from { transform: translateX(-50%) scale(1.15); } to { transform: translateX(-50%) scale(1.4); } }
    .label {
      margin-top: 8px; font-size: 16px; font-weight: 700; padding: 5px 16px; border-radius: 99px;
      background: rgba(4,15,32,0.85); border: 1px solid rgba(0,243,255,0.4);
    }
    .green-t { color: var(--green); text-shadow: 0 0 10px rgba(0,255,136,0.6); }
    .cyan-t { color: var(--cyan); text-shadow: 0 0 10px rgba(0,243,255,0.6); }
    .panel {
      background: rgba(6,18,36,0.92); border: 1px solid rgba(0,243,255,0.45); border-radius: 20px;
      padding: 18px 24px; max-width: 820px; width: 100%; margin: 10px auto 4px; text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }
    #msg { font-size: 16px; color: #dff8ff; min-height: 24px; }
    .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    input {
      flex: 1; min-width: 220px; padding: 14px 18px; border-radius: 12px; border: 1px solid rgba(0,243,255,0.45);
      background: #040c1a; color: #fff; font-size: 16px; outline: none;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,243,255,0.35); }
    button {
      padding: 14px 20px; border-radius: 12px; border: 2px solid var(--cyan);
      background: linear-gradient(135deg, rgba(0,243,255,0.22), rgba(0,140,255,0.28));
      color: #fff; font-weight: 700; cursor: pointer; font-size: 15px; white-space: nowrap; transition: 0.2s;
    }
    button:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0,243,255,0.45); }
    #mic-btn { border-color: var(--green); background: linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,180,100,0.25)); }
    #mic-btn.listening { border-color: var(--pink); background: rgba(255,51,102,0.35); box-shadow: 0 0 24px rgba(255,51,102,0.6); }
  </style>
</head>
<body>
  <header>
    <div class="pill">🟢 Shiva & Sky • 3D-Wireframe-Hologramm</div>
    <div class="pill" id="stat">Bereit</div>
  </header>

  <div class="stage">
    <div class="entity">
      <div class="heart">💖</div>
      <div id="slot-shiva" style="width:100%;height:100%;display:flex;justify-content:center;"></div>
      <div class="label green-t">🐾 Shiva (1 Gesichtshälfte grün)</div>
    </div>

    <div class="entity">
      <div id="slot-head" style="width:100%;height:100%;display:flex;justify-content:center;"></div>
      <div class="label cyan-t">🧠 Hologramm-Assistent</div>
    </div>

    <div class="entity">
      <div class="heart">💖</div>
      <div id="slot-sky" style="width:100%;height:100%;display:flex;justify-content:center;"></div>
      <div class="label green-t">🐾 Sky (Beide Hälften grün)</div>
    </div>
  </div>

  <div class="panel">
    <p id="msg">Drücke auf „Reinsprechen“ oder tippe eine Frage ein!</p>
    <div class="row">
      <button id="mic-btn">🎤 Reinsprechen</button>
      <input type="text" id="inp" placeholder="Oder hier Frage eintippen..." />
      <button id="btn">🥺 Sanft winseln</button>
    </div>
  </div>

  <script>
    function renderDog(targetId, bothGreen, tailSide) {
      const rightFace = bothGreen ? 'face-green' : 'face-cyan';
      const tailPoly = tailSide === 'left'
        ? `<polygon points="85,215 32,162 52,150 95,205" class="wire-cyan tail-l" style="transform-origin:85px 215px"/>`
        : `<polygon points="215,215 268,162 248,150 205,205" class="wire-cyan tail-r" style="transform-origin:215px 215px"/>`;

      document.getElementById(targetId).innerHTML = `
      <svg class="holo-svg" viewBox="0 0 300 320">
        <ellipse cx="150" cy="285" rx="118" ry="20" class="wire-cyan"/>
        <ellipse cx="150" cy="285" rx="88" ry="14" class="wire-fine"/>
        <ellipse cx="150" cy="285" rx="54" ry="8" class="wire-fine"/>
        <g class="dog-body">
          ${tailPoly}
          <polygon points="92,275 82,205 118,142 182,142 218,205 208,275" class="wire-cyan"/>
          <path d="M82,205 L218,205 M88,240 L212,240 M102,172 L198,172 M118,142 L150,275 L182,142 M82,205 L150,142 L218,205 M92,275 L150,172 L208,275 M150,142 L150,275" class="wire-fine"/>
          <polygon points="128,202 122,280 142,280 145,202" class="wire-cyan"/>
          <line x1="125" y1="240" x2="143" y2="240" class="wire-fine"/>
          <polygon points="155,202 158,280 178,280 172,202" class="wire-cyan"/>
          <line x1="157" y1="240" x2="175" y2="240" class="wire-fine"/>
          <polygon points="105,95 90,38 130,76" class="face-green"/>
          <line x1="90" y1="38" x2="116" y2="86" class="wire-fine"/>
          <polygon points="195,95 210,38 170,76" class="${rightFace}"/>
          <line x1="210" y1="38" x2="184" y2="86" class="wire-fine"/>
          <polygon points="150,64 105,95 98,136 150,154" class="face-green"/>
          <polygon points="150,64 195,95 202,136 150,154" class="${rightFace}"/>
          <path d="M105,95 L150,92 L195,95 M98,116 L150,114 L202,116 M98,136 L150,134 L202,136 M150,64 L126,114 L150,154 M150,64 L174,114 L150,154 M105,95 L126,114 L98,136 M195,95 L174,114 L202,136" class="wire-fine"/>
          <polygon points="133,124 167,124 159,149 141,149" class="wire-cyan"/>
          <polygon points="143,126 157,126 150,135" class="wire-cyan"/>
          <path d="M144,149 L156,149 L155,167 Q150,173 145,167 Z" class="dog-tongue"/>
          <circle cx="127" cy="107" r="5" class="dog-eye"/>
          <circle cx="173" cy="107" r="5" class="dog-eye"/>
        </g>
      </svg>`;
    }

    document.getElementById('slot-head').innerHTML = `
    <svg class="holo-svg head-svg" viewBox="0 0 300 320">
      <ellipse cx="150" cy="285" rx="108" ry="18" class="wire-cyan"/>
      <ellipse cx="150" cy="285" rx="74" ry="12" class="wire-fine"/>
      <path d="M72,285 L108,205 M228,285 L192,205 M115,285 L130,220 M185,285 L170,220" class="wire-fine"/>
      <polygon points="150,30 92,62 78,128 102,196 150,224 198,196 222,128 208,62" class="wire-cyan"/>
      <path d="M92,62 L150,76 L208,62 M84,96 L150,104 L216,96 M78,128 L150,138 L222,128 M88,164 L150,170 L212,164 M102,196 L150,194 L198,196 M150,30 L150,224 M120,46 L112,128 L124,210 M180,46 L188,128 L176,210 M92,62 L124,128 L102,196 M208,62 L176,128 L198,196" class="wire-fine"/>
      <polygon points="104,112 142,118 106,125" class="wire-cyan"/>
      <polygon points="196,112 158,118 194,125" class="wire-cyan"/>
      <polygon points="126,174 174,174 166,186 134,186" class="wire-cyan"/>
    </svg>`;

    renderDog('slot-shiva', false, 'left');
    renderDog('slot-sky', true, 'right');

    // Sanftes, natürliches Hundewinseln ohne Computerstimme & ohne Bellen
    function playSoftWhine() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [0, 1.35].forEach((offset, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const base = idx === 0 ? 540 : 610;
          osc.frequency.setValueAtTime(base, now + offset);
          osc.frequency.exponentialRampToValueAtTime(base + 190, now + offset + 0.45);
          osc.frequency.exponentialRampToValueAtTime(base - 40, now + offset + 1.05);

          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.linearRampToValueAtTime(0.09, now + offset + 0.18);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 1.1);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 1.15);
        });
      } catch (e) {}
    }

    const btn = document.getElementById('btn'),
          micBtn = document.getElementById('mic-btn'),
          inp = document.getElementById('inp'),
          msg = document.getElementById('msg'),
          stat = document.getElementById('stat');

    let timer;
    function run(q) {
      clearTimeout(timer);
      document.body.classList.add('whine');
      stat.textContent = 'Sanftes Winseln ✨';
      msg.textContent = q
        ? `„${q}“ — Shiva & Sky stehen auf, winseln sanft, Augen leuchten pink & das Herzchen schwebt!`
        : 'Shiva & Sky stehen auf, winseln sanft, Augen leuchten pink & das Herzchen schwebt!';
      playSoftWhine();
      timer = setTimeout(() => {
        document.body.classList.remove('whine');
        stat.textContent = 'Bereit';
        msg.textContent = 'Shiva & Sky haben sich wieder gemütlich auf ihre Ringe gesetzt.';
      }, 4500);
    }

    btn.onclick = () => { run(inp.value.trim()); inp.value = ''; };
    inp.onkeypress = (e) => { if (e.key === 'Enter' && inp.value.trim()) { run(inp.value.trim()); inp.value = ''; } };

    // Mikrofon-Spracherkennung zum Reinsprechen
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.lang = 'de-DE';
      rec.interimResults = false;
      micBtn.onclick = () => {
        micBtn.classList.add('listening');
        micBtn.textContent = '🔴 Ich höre zu...';
        stat.textContent = 'Mikrofon aktiv...';
        rec.start();
      };
      rec.onresult = (e) => {
        const spoken = e.results[0][0].transcript;
        inp.value = spoken;
        run(spoken);
        inp.value = '';
      };
      rec.onend = () => {
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤 Reinsprechen';
      };
      rec.onerror = () => {
        micBtn.classList.remove('listening');
        micBtn.textContent = '🎤 Reinsprechen';
        stat.textContent = 'Mikrofon prüfen';
      };
    } else {
      micBtn.onclick = () => { msg.textContent = 'Bitte Chrome nutzen, um das Mikrofon zu verwenden.'; };
    }
  </script>
</body>
</html>
