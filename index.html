<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • 3D-Drahtgitter-Hologramm</title>
  <!-- Three.js für echte 3D-Wireframe-Objekte -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.025) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 30;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }

    /* 3-Spalten-Bühne */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(280px, 1.15fr) minmax(340px, 640px) minmax(280px, 1.15fr);
      align-items: center;
      gap: 12px;
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
      padding: 4px 16px 24px;
      z-index: 20;
    }

    .holo-companion {
      position: relative;
      height: 74vh;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 40px;
    }

    .canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .pet-tag {
      position: relative;
      z-index: 5;
      background: rgba(4, 16, 34, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #dffbff;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.25);
    }

    .center-column {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
