<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • 3D-Hologramm-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --pink: #ff3366;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Scanlines für echten Hologramm-Look */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.03) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 20px;
      z-index: 20;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      transition: all 0.3s ease;
    }

    body.is-whining .dot {
      background: var(--pink);
      box-shadow: 0 0 20px var(--pink);
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
    }

    .main-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex: 1;
      z-index: 20;
    }

    /* Hologramm-Bühne für die Wireframe-Avatare */
    .stage-row {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 600px;
      justify-content: center;
    }

    .holo-box {
      flex: 1;
      background: rgba(5, 15, 30, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
    }

    /* Drahtgitter-Silhouette der Hunde im Envato-Look */
    .wireframe-dog {
      font-size: 48px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 12px var(--cyan));
      transition: transform 0.3s ease;
    }

    body.is-whining .wireframe-dog {
      transform: translateY(-8px) scale(1.08);
      animation: wagTail 0.15s ease-in-out infinite alternate;
    }

    @keyframes wagTail {
      0% { transform: translateY(-8px) rotate(-3deg); }
      100% { transform: translateY(-12px) rotate(3deg); }
    }

    /* Markierte Gesichtshälften in hellem Grün */
    .dog-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--cyan);
    }

    .dog-name.shiva-accent {
      color: var(--green);
      text-shadow: 0 0 10px var(--green);
    }

    .dog-name.sky-accent {
      color: var(--green);
      text-shadow: 0 0 10px var(--green);
    }

    /* Schwebendes Herzchen */
    .heart-badge {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      font-size: 32px;
      filter: drop-shadow(0 0 12px var(--pink));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    body.is-whining .heart-badge {
      transform: translateX(-50%) scale(1.3);
      animation: pulseHeart 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulseHeart {
      0% { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1.4); }
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    }

    h1 { color: var(--cyan); margin-bottom: 12px; font-size: 22px; }
    p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; color: #d0e8ff; }

    .treat-btn {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(0, 160, 255, 0.3));
      color: #ffffff;
      border: 2px solid var(--cyan);
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .treat-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot"></span>
      <span>Shiva & Sky • Hologramm</span>
    </div>
    <div class="status-pill" id="status-text">Bereit</div>
  </header>

  <div class="main-container">
    <!-- Hologramm-Bühne mit den Hunden -->
    <div class="stage-row">
      <div class="holo-box" id="box-shiva">
        <div class="heart-badge">💖</div>
        <div class="wireframe-dog">🐕</div>
        <div class="dog-name shiva-accent">🐾 Shiva (1 Hälfte)</div>
      </div>
      <div class="holo-box" id="box-sky">
        <div class="heart-badge">💖</div>
        <div class="wireframe-dog">🐕</div>
        <div class="dog-name sky-accent">🐾 Sky (2 Hälften)</div>
      </div>
    </div>

    <div class="card">
      <h1>🐾 Shiva & Sky Hologramm</h1>
      <p id="msg">Die Bühne ist aktiv. Klicke auf den Button, damit die Hunde sanft winseln, ihre Augen aufleuchten und das Herzchen erscheint!</p>
      <button class="treat-btn" id="treat-btn">🥺 Sanft winseln & aufstehen</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('treat-btn');
    const msg = document.getElementById('msg');
    const statusText = document.getElementById('status-text');

    btn.addEventListener('click', () => {
      document.body.classList.add('is-whining');
      statusText.textContent = 'Winseln & Freuen ✨';
      msg.textContent = 'Shiva & Sky stehen auf, ihre Augen leuchten pink, das Herzchen schwebt über ihnen, sie wedeln mit dem Schwanz und zeigen die Zunge!';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance('*Wuff Wuff* Wir freuen uns so!');
        utter.lang = 'de-DE';
        utter.pitch = 1.3;
        window.speechSynthesis.speak(utter);
      }

      setTimeout(() => {
        document.body.classList.remove('is-whining');
        statusText.textContent = 'Bereit';
        msg.textContent = 'Shiva & Sky haben sich wieder gemütlich hingelegt.';
      }, 5000);
    });
  </script>
</body>
</html>
