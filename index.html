<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Persönlicher KI-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.025) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 30;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all 0.3s ease;
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      text-align: center;
    }

    .settings-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #d0e8ff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .settings-toggle:hover {
      background: rgba(0, 243, 255, 0.18);
      border-color: var(--cyan);
    }

    /* 3-Spalten-Bühne: Links Shiva • Mitte Chat • Rechts Sky */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(280px, 1.15fr) minmax(340px, 640px) minmax(280px, 1.15fr);
      align-items: center;
      gap: 12px;
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
      padding: 4px 16px 24px;
      z-index: 20;
    }

    .holo-companion {
      position: relative;
      height: 76vh;
      min-height: 440px;
      max-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 48px;
      cursor: pointer;
      user-select: none;
      perspective: 900px;
    }

    .holo-avatar-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      animation: holoFloat 4.2s ease-in-out infinite;
    }

    #sky-stage .holo-avatar-wrap {
      animation-delay: -2.1s;
    }

    @keyframes holoFloat {
      0%, 100% { transform: translateY(0px) rotateZ(-0.8deg); }
      50% { transform: translateY(-8px) rotateZ(1deg); }
    }

    body.state-listening .holo-avatar-wrap {
      animation: headTiltListen 2.2s ease-in-out infinite;
    }

    @keyframes headTiltListen {
      0%, 100% { transform: rotateZ(4deg) scale(1.02); }
      50% { transform: rotateZ(7deg) scale(1.04); }
    }

    .holo-companion.active-speaker.is-speaking .holo-avatar-wrap {
      animation: speakBounce 0.34s ease-in-out infinite alternate;
    }

    @keyframes speakBounce {
      0% { transform: translateY(0px) scaleY(1) scaleX(1); }
      100% { transform: translateY(-6px) scaleY(1.03) scaleX(0.99); }
    }

    .holo-dog-img {
      max-width: 100%;
      max-height: 98%;
      width: auto;
      height: 96%;
      object-fit: contain;
      object-position: bottom center;
      -webkit-mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
      filter:
        drop-shadow(0 0 18px rgba(0, 243, 255, 0.55))
        drop-shadow(0 0 38px rgba(0, 160, 255, 0.25))
        contrast(1.05)
        saturate(1.08);
      transition: filter 0.3s ease, transform 0.2s ease;
    }

    #sky-stage .holo-dog-img {
      transform: scale(1.08);
      transform-origin: bottom center;
    }

    .holo-companion.active-speaker .holo-dog-img {
      filter:
        drop-shadow(0 0 24px rgba(0, 255, 136, 0.72))
        drop-shadow(0 0 46px rgba(0, 243, 255, 0.35))
        contrast(1.08)
        saturate(1.12);
    }

    .holo-scan-overlay {
      position: absolute;
      inset: 4% 8% 4%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.07) 4px
      );
      pointer-events: none
