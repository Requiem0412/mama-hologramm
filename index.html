<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shiva & Sky Hologramm</title>
<style>
:root{--c:#00f3ff;--g:#00ff88;--p:#ff3366}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% 35%,#091d3a 0%,#02060f 80%);color:#fff;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding:14px 24px}
header{display:flex;justify-content:space-between;max-width:1540px;width:100%;margin:0 auto 6px}
.pill{background:rgba(0,243,255,.1);border:1px solid rgba(0,243,255,.45);padding:8px 18px;border-radius:99px;font-weight:600;font-size:16px;color:var(--c)}
.stage{flex:1;display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:16px;max-width:1540px;width:100%;margin:auto;align-items:center;text-align:center}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:44vh;min-height:280px}
svg{width:100%;max-width:340px;height:100%;max-height:340px;filter:drop-shadow(0 0 12px rgba(0,243,255,.7));overflow:visible}
.head{max-width:290px;animation:flt 4s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
body.ans .head{filter:drop-shadow(0 0 24px var(--c)) drop-shadow(0 0 40px var(--g))}
.wc{fill:rgba(0,243,255,.06);stroke:var(--c);stroke-width:1.5;stroke-linejoin:round}
.wf{fill:none;stroke:rgba(0,243,255,.42);stroke-width:.85}
.fg{fill:rgba(0,255,136,.22);stroke:var(--g);stroke-width:1.8;filter:drop-shadow(0 0 8px var(--g))}
.fc{fill:rgba(0,243,255,.08);stroke:var(--c);stroke-width:1.5}
.eye{fill:var(--c);transition:.25s;transform-box:fill-box;transform-origin:center}
.tng{fill:rgba(255,51,102,.5);stroke:var(--p);stroke-width:1.5;opacity:0;transition:.25s}
.bdy{transform-origin:150px 260px;transition:.35s cubic-bezier(.22,1,.36,1)}
body.whn .bdy{transform:translateY(-20px) scaleY(1.07)}
body.whn .eye{fill:var(--p);filter:drop-shadow(0 0 10px var(--p));animation:blk 1.2s infinite}
@keyframes blk{0%,42%,52%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
body.whn .tng{opacity:1}
body.whn .tl{animation:wl .14s infinite alternate}body.whn .tr{animation:wr .14s infinite alternate}
@keyframes wl{from{transform:rotate(-16deg)}to{transform:rotate(22deg)}}@keyframes wr{from{transform:rotate(16deg)}to{transform:rotate(-22deg)}}
.hrt{position:absolute;top:0;left:50%;transform:translateX(-50%) scale(0);font-size:42px;transition:.35s;z-index:20}
body.whn .hrt{transform:translateX(-50%) scale(1.25)}
.lbl{margin-top:6px;font-size:16px;font-weight:700;padding:5px 16px;border-radius:99px;background:rgba(4,15,32,.85);border:1px solid rgba(0,243,255,.4);color:var(--g)}

/* Großes, gut lesbares Antwortfenster für Mama */
.pnl{background:rgba(6,18,36,.96);border:2px solid rgba(0,243,255,.55);border-radius:24px;padding:26px 34px;max-width:1150px;width:100%;margin:12px auto 6px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.7)}
#uq{font-size:18px;color:#8ad8ff;margin-bottom:8px;min-height:22px;font-weight:500}
#msg{font-size:26px;line-height:1.45;font-weight:600;color:#ffffff;min-height:42px;max-height:24vh;overflow-y:auto;padding:4px 8px}
.row{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap}
input{flex:1;min-width:260px;padding:18px 22px;border-radius:14px;border:2px solid rgba(0,243,255,.5);background:#040c1a;color:#fff;font-size:20px;outline:none}
input:focus{border-color:var(--c);box-shadow:0 0 16px rgba(0,243,255,.4)}
button{padding:18px 24px;border-radius:14px;border:2px solid var(--c);background:rgba(0,243,255,.22);color:#fff;font-weight:700;cursor:pointer;font-size:19px}
button:hover{transform:scale(1.02)}
#mic{border-color:var(--g);background:rgba(0,255,136,.22)}#mic.on{border-color:var(--p);background:rgba(255,51,102,.35)}
#trt{border-color:#fa0;background:rgba(255,170,0,.24)}
</style>
</head>
