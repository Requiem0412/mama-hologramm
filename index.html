<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Hologramm</title>
  <style>
    :root { --cyan: #00f3ff; --green: #00ff88; --pink: #ff3366; --bg: #030812; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh;
      display: flex; flex-direction: column; padding: 20px;
    }
    header { display: flex; justify-content: space-between; max-width: 1100px; width: 100%; margin: 0 auto 30px; }
    .pill { background: rgba(0,243,255,0.12); border: 1px solid rgba(0,243,255,0.45); padding: 8px 16px; border-radius: 99px; font-weight: 600; color: var(--cyan); }
    .stage { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; max-width: 950px; width: 100%; margin: auto; text-align: center; align-items: center; }
    .entity { position: relative; padding: 15px; }
    .icon { font-size: 64px; margin-bottom: 10px; filter: drop-shadow(0 0 15px var(--cyan)); transition: 0.3s; }
    body.whine .icon { transform: translateY(-10px) scale(1.12); filter: drop-shadow(0 0 22px var(--pink)); animation: wag 0.15s infinite alternate; }
    @keyframes wag { from { transform: translateY(-8px) rotate(-3deg); } to { transform: translateY(-12px) rotate(3deg); } }
    .heart { position: absolute; top: -15px; left: 50%; transform: translateX(-50%) scale(0); font-size: 32px; transition: 0.3s; }
    body.whine .heart { transform: translateX(-50%) scale(1.3); }
    .green { color: var(--green); text-shadow: 0 0 10px var(--green); font-weight: 700; }
    .panel { background: rgba(8,22,42,0.92); border: 1px solid rgba(0,243,255,0.4); border-radius: 20px; padding: 24px; max-width: 680px; width: 100%; margin: 20px auto; text-align: center; }
    .row { display: flex; gap: 10px; margin-top: 15px; }
    input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(0,243,255,0.4); background: #050f1e; color: #fff; font-size: 16px; }
    button { padding: 14px 22px; border-radius: 12px; border: 2px solid var(--cyan); background: rgba(0,243,255,0.25); color: #fff; font-weight: 700; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="pill">🟢 Shiva & Sky • Hologramm</div>
    <div class="pill" id="stat">Bereit</div>
  </header>

  <div class="stage">
    <div class="entity"><div class="heart">💖</div><div class="icon">🐕</div><div class="green">🐾 Shiva (1 Hälfte)</div></div>
    <div class="entity"><div class="icon">🗣️</div><div style="color:var(--cyan);font-weight:700;">🧠 Hologramm-Kopf</div></div>
    <div class="entity"><div class="heart">💖</div><div class="icon">🐕</div><div class="green">🐾 Sky (2 Hälften)</div></div>
  </div>

  <div class="panel">
    <p id="msg">Bühne aktiv. Frage stellen oder Button drücken!</p>
    <div class="row">
      <input type="text" id="inp" placeholder="Frage eintippen..." />
      <button id="btn">🎙️ Winseln & Sprechen</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn'), inp = document.getElementById('inp'), msg = document.getElementById('msg'), stat = document.getElementById('stat');
    function run(q) {
      document.body.classList.add('whine');
      stat.textContent = 'Winseln & Augen leuchten ✨';
      msg.textContent = q ? `Frage: „${q}“ — Shiva & Sky winseln, Augen leuchten pink & der Kopf antwortet!` : 'Shiva & Sky winseln, Augen leuchten pink, Herzchen schwebt & der Kopf spricht!';
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(q ? `Du fragst: ${q}. Wuff wuff, wir freuen uns!` : 'Wuff wuff! Wir hören dir zu!');
        u.lang = 'de-DE'; u.pitch = 1.3; speechSynthesis.speak(u);
      }
      setTimeout(() => { document.body.classList.remove('whine'); stat.textContent = 'Bereit'; msg.textContent = 'Shiva & Sky haben sich wieder hingelegt.'; }, 5000);
    }
    btn.onclick = () => { run(inp.value.trim()); inp.value = ''; };
    inp.onkeypress = (e) => { if (e.key === 'Enter' && inp.value.trim()) { run(inp.value.trim()); inp.value = ''; } };
  </script>
</body>
</html>
