<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Hologramm-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --pink: #ff3366;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      transition: all 0.3s ease;
    }

    /* Leucht-Effekt wenn die Hunde winseln */
    body.is-whining .dot {
      background: var(--pink);
      box-shadow: 0 0 20px var(--pink), 0 0 40px var(--pink);
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
      transition: all 0.3s ease;
    }

    body.is-whining .status-pill {
      border-color: var(--pink);
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
    }

    .main-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Herzchen-Badge das kurz aufleuchtet */
    .heart-overlay {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      font-size: 42px;
      filter: drop-shadow(0 0 16px var(--pink));
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    body.is-whining .heart-overlay {
      transform: translateX(-50%) scale(1.2);
      animation: pulseHeart 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulseHeart {
      0% { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1.3); }
    }

    h1 { color: var(--cyan); margin-bottom: 15px; font-size: 24px; }
    p { font-size: 17px; line-height: 1.5; margin-bottom: 25px; color: #d0e8ff; }

    .treat-btn {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(0, 160, 255, 0.3));
      color: #ffffff;
      border: 2px solid var(--cyan);
      padding: 15px 30px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .treat-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot"></span>
      <span>Shiva & Sky • Hologramm</span>
    </div>
    <div class="status-pill" id="status-text">Bereit</div>
  </header>

  <div class="main-container">
    <div class="card">
      <div class="heart-overlay">💖</div>
      <h1>🐾 Shiva & Sky Hologramm</h1>
      <p id="msg">Die Bühne ist aktiv. Klicke auf den Button, damit die Hunde sanft winseln und ihre Augen magisch aufleuchten!</p>
      <button class="treat-btn" id="treat-btn">🥺 Sanft winseln & Augen leuchten</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('treat-btn');
    const msg = document.getElementById('msg');
    const statusText = document.getElementById('status-text');

    btn.addEventListener('click', () => {
      document.body.classList.add('is-whining');
      statusText.textContent = 'Winseln & Augen leuchten ✨';
      msg.textContent = 'Shiva & Sky fangen an sanft zu winseln, ihre Hologramm-Augen leuchten pink auf, das Herzchen schwebt über ihnen und sie wedeln mit dem Schwanz!';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance('*Wuff Wuff* Wimper wimper...');
        utter.lang = 'de-DE';
        utter.pitch = 1.3;
        window.speechSynthesis.speak(utter);
      }

      setTimeout(() => {
        document.body.classList.remove('is-whining');
        statusText.textContent = 'Bereit';
        msg.textContent = 'Shiva & Sky haben sich wieder gemütlich hingelegt.';
      }, 5000);
    });
  </script>
</body>
</html>
