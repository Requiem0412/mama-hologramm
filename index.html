<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shiva & Sky Hologramm</title>
<style>
:root{--c:#00f3ff;--g:#00ff88;--p:#ff3366}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% 35%,#091d3a 0%,#02060f 80%);color:#fff;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding:12px 24px}
header{display:flex;justify-content:space-between;max-width:1540px;width:100%;margin:0 auto 4px}
.pill{background:rgba(0,243,255,.1);border:1px solid rgba(0,243,255,.45);padding:7px 18px;border-radius:99px;font-weight:600;color:var(--c)}
.stage{flex:1;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:16px;max-width:1540px;width:100%;margin:auto;align-items:center;text-align:center;perspective:1000px}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:42vh;min-height:270px}
svg{width:100%;max-width:320px;height:100%;max-height:320px;filter:drop-shadow(0 0 12px rgba(0,243,255,.7));overflow:visible}
.head{max-width:390px;max-height:370px;animation:hIdle 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes hIdle{0%,100%{transform:translateY(0) rotateY(-15deg)}50%{transform:translateY(-10px) rotateY(15deg)}}
body.ans .head{animation:hTalk 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 0 22px var(--c)) drop-shadow(0 0 40px var(--g))}
@keyframes hTalk{from{transform:translateY(-4px) rotateY(-7deg) scale(1.04)}to{transform:translateY(-8px) rotateY(7deg) scale(1.04)}}
#hm{transform-box:fill-box;transform-origin:center}
body.ans #hm{animation:lip .2s ease-in-out infinite alternate}
@keyframes lip{from{transform:scaleY(.45) scaleX(1.06)}to{transform:scaleY(2.1) scaleX(.95)}}
.wc{fill:rgba(0,243,255,.06);stroke:var(--c);stroke-width:1.5;stroke-linejoin:round}
.wf{fill:none;stroke:rgba(0,243,255,.45);stroke-width:.85}
.laser{fill:none;stroke:rgba(0,243,255,.62);stroke-width:.85;stroke-dasharray:2 1.5}
.laser-b{fill:rgba(0,243,255,.04);stroke:var(--c);stroke-width:1.4}
.fg{fill:rgba(0,255,136,.22);stroke:var(--g);stroke-width:1.8;filter:drop-shadow(0 0 8px var(--g))}
.fc{fill:rgba(0,243,255,.08);stroke:var(--c);stroke-width:1.5}
.eye{fill:var(--c);transition:.25s;transform-box:fill-box;transform-origin:center}
.tng{fill:rgba(255,51,102,.5);stroke:var(--p);stroke-width:1.5;opacity:0;transition:.25s}
.bdy{transform-box:fill-box;transform-origin:center bottom;transition:.4s}
body.whn .bdy{animation:dogSpin 1.4s ease-in-out forwards}
@keyframes dogSpin{0%{transform:translateY(0) rotateY(0deg)}25%{transform:translateY(-22px) scaleY(1.06) rotateY(0deg)}85%{transform:translateY(-22px) scaleY(1.06) rotateY(360deg)}100%{transform:translateY(-20px) scaleY(1.06) rotateY(360deg)}}
body.whn .eye{fill:var(--p);filter:drop-shadow(0 0 10px var(--p));animation:blk 1.1s 1.2s infinite}
@keyframes blk{0%,42%,52%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
body.whn .tng{opacity:1;transition-delay:1.1s}
body.whn .tl{animation:wl .13s infinite alternate}body.whn .tr{animation:wr .13s infinite alternate}
@keyframes wl{from{transform:rotate(-18deg)}to{transform:rotate(24deg)}}@keyframes wr{from{transform:rotate(18deg)}to{transform:rotate(-24deg)}}
.hrt{position:absolute;top:-6px;left:50%;transform:translateX(-50%) scale(0);font-size:44px;transition:.4s 1.1s cubic-bezier(.18,.89,.32,1.28);z-index:20}
body.whn .hrt{transform:translateX(-50%) scale(1.28)}
.lbl{margin-top:6px;font-size:15px;font-weight:700;padding:5px 16px;border-radius:99px;background:rgba(4,15,32,.85);border:1px solid rgba(0,243,255,.4);color:var(--g)}
.pnl{background:rgba(6,18,36,.96);border:2px solid rgba(0,243,255,.55);border-radius:24px;padding:24px 34px;max-width:1180px;width:100%;margin:8px auto 4px;text-align:center}
#uq{font-size:18px;color:#8ad8ff;margin-bottom:8px;min-height:22px}
#msg{font-size:25px;line-height:1.45;font-weight:600;min-height:105px;max-height:28vh;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:4px 10px}
.row{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
input{flex:1;min-width:250px;padding:17px 20px;border-radius:14px;border:2px solid rgba(0,243,255,.5);background:#040c1a;color:#fff;font-size:20px}
button{padding:17px 24px;border-radius:14px;border:2px solid var(--c);background:rgba(0,243,255,.22);color:#fff;font-weight:700;cursor:pointer;font-size:19px}
#mic{border-color:var(--g);background:rgba(0,255,136,.22)}#mic.on{border-color:var(--p);background:rgba(255,51,102,.35)}
#trt{border-color:#fa0;background:rgba(255,170,0,.24)}
</style>
</head>
<body>
<header><div class="pill">🟢 Shiva & Sky • Hologramm</div><div class="pill" id="st">Bereit</div></header>
<div class="stage">
  <div class="ent"><div class="hrt">💖</div><div id="s1" style="width:100%;height:100%;display:flex;justify-content:center"></div><div class="lbl">🐾 Shiva (1 Hälfte grün)</div></div>
  <div class="ent"><div id="sh" style="width:100%;height:100%;display:flex;justify-content:center"></div><div class="lbl" style="color:var(--c)">🧠 Hologramm-Assistent</div></div>
  <div class="ent"><div class="hrt">💖</div><div id="s2" style="width:100%;height:100%;display:flex;justify-content:center"></div><div class="lbl">🐾 Sky (2 Hälften grün)</div></div>
</div>
<div class="pnl">
  <div id="uq"></div><p id="msg">Stelle eine Frage per Mikrofon oder Text – oder gib Shiva & Sky ein Leckerli!</p>
  <div class="row"><button id="mic">🎤 Reinsprechen</button><input id="inp" placeholder="Frage eintippen..."><button id="ask">💬 Fragen</button><button id="trt">🦴 Leckerli</button></div>
</div>
<script>
function dog(id,bg,side){const rf=bg?'fg':'fc',tp=side==='l'?`<polygon points="85,215 32,162 52,150 95,205" class="wc tl" style="transform-origin:85px 215px"/>`:`<polygon points="215,215 268,162 248,150 205,205" class="wc tr" style="transform-origin:215px 215px"/>`;document.getElementById(id).innerHTML=`<svg viewBox="0 0 300 320"><ellipse cx="150" cy="285" rx="118" ry="20" class="wc"/><ellipse cx="150" cy="285" rx="80" ry="13" class="wf"/><g class="bdy">${tp}<polygon points="92,275 82,205 118,142 182,142 218,205 208,275" class="wc"/><path d="M82,205 L218,205 M88,240 L212,240 M118,142 L150,275 L182,142 M82,205 L150,142 L218,205 M150,142 L150,275" class="wf"/><polygon points="128,202 122,280 142,280 145,202" class="wc"/><polygon points="155,202 158,280 178,280 172,202" class="wc"/><polygon points="105,95 90,38 130,76" class="fg"/><polygon points="195,95 210,38 170,76" class="${rf}"/><polygon points="150,64 105,95 98,136 150,154" class="fg"/><polygon points="150,64 195,95 202,136 150,154" class="${rf}"/><path d="M105,95 L150,92 L195,95 M98,116 L150,114 L202,116 M150,64 L126,114 L150,154 M150,64 L174,114 L150,154" class="wf"/><polygon points="133,124 167,124 159,149 141,149" class="wc"/><path d="M144,149 L156,149 L155,167 Q150,173 145,167 Z" class="tng"/><circle cx="127" cy="107" r="5" class="eye"/><circle cx="173" cy="107" r="5" class="eye"/></g></svg>`}
/* Engmaschiges 3D-Laserraster für den Kopf */
let grid='';for(let y=36;y<=224;y+=10){const w=Math.sin((y-24)/204*Math.PI)*74;grid+=`<path d="M${150-w},${y} Q150,${y+8} ${150+w},${y}" class="laser"/>`}
for(let x=-60;x<=60;x+=12){grid+=`<path d="M${150+x*0.35},28 Q${150+x*1.25},126 ${150+x*0.45},228" class="laser"/>`}
document.getElementById('sh').innerHTML=`<svg class="head" viewBox="0 0 300 320"><ellipse cx="150" cy="285" rx="112" ry="18" class="wc"/><ellipse cx="150" cy="285" rx="76" ry="12" class="wf"/><path d="M72,285 L108,215 M228,285 L192,215 M112,285 L126,225 M188,285 L174,225" class="wf"/><path d="M150,24 C95,24 74,66 76,122 C78,176 112,226 150,230 C188,226 222,176 224,122 C226,66 205,24 150,24 Z" class="laser-b"/>${grid}<path d="M150,96 L142,148 L150,154 L158,148 Z" class="wc"/><ellipse cx="120" cy="112" rx="17" ry="8" class="wc"/><ellipse cx="180" cy="112" rx="17" ry="8" class="wc"/><circle cx="120" cy="112" r="3.5" fill="#00ff88"/><circle cx="180" cy="112" r="3.5" fill="#00ff88"/><path id="hm" d="M126,178 Q150,173 174,178 Q150,192 126,178 Z" class="wc"/></svg>`;
dog('s1',false,'l');dog('s2',true,'r');
function whine(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),n=c.currentTime;[0,1.3].forEach((o,i)=>{const s=c.createOscillator(),g=c.createGain();s.frequency.setValueAtTime(540+i*70,n+o);s.frequency.exponentialRampToValueAtTime(750,n+o+.45);s.frequency.exponentialRampToValueAtTime(500,n+o+1.05);g.gain.setValueAtTime(.001,n+o);g.gain.linearRampToValueAtTime(.09,n+o+.18);g.gain.exponentialRampToValueAtTime(.001,n+o+1.1);s.connect(g);g.connect(c.destination);s.start(n+o);s.stop(n+o+1.15)})}catch(e){}}
function spk(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.96;const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('de'));const b=vs.find(v=>/anna|helena|petra|markus/i.test(v.name))||vs[0];if(b)u.voice=b;u.onend=()=>document.body.classList.remove('ans');speechSynthesis.speak(u)}
const ask=document.getElementById('ask'),trt=document.getElementById('trt'),mic=document.getElementById('mic'),inp=document.getElementById('inp'),uq=document.getElementById('uq'),msg=document.getElementById('msg'),st=document.getElementById('st');let tm;
function dogs(t){clearTimeout(tm);if('speechSynthesis' in window)speechSynthesis.cancel();document.body.classList.remove('ans');document.body.classList.add('whn');st.textContent='Leckerli-Freude ✨';uq.textContent=t?`Du: „${t}“`:'';msg.textContent='Shiva & Sky stehen auf, wedeln mit dem Schwanz, drehen sich vor Freude im Kreis und blinzeln dir mit Herzchen zu!';whine();tm=setTimeout(()=>{document.body.classList.remove('whn');st.textContent='Bereit'},5200)}
async function ans(q){
  q=q.trim();if(!q)return;const l=q.toLowerCase();
  if(/(leckerli|winsel|fein|brav|streichel|gassi|shiva|sky)/.test(l)&&!l.includes('?')){dogs(q);return}
  clearTimeout(tm);document.body.classList.remove('whn');document.body.classList.add('ans');st.textContent='Assistent antwortet 🧠';uq.textContent=`Frage: „${q}“`;msg.textContent='Einen Moment, ich überlege...';
  let r='';
  if(/(brennt|feuer|notfall|112)/.test(l))r='Achtung! Wenn es brennt oder ein Notfall ist, wähle bitte sofort die 112 für Feuerwehr und Rettungsdienst!';
  else if(l.includes('wie spät')||l.includes('uhrzeit'))r=`Es ist gerade ${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr.`;
  else if(l.includes('datum')||l.includes('welcher tag'))r=`Heute ist ${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}.`;
  else{
    try{
      const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
      if(res.ok){const d=await res.json();if(d.reply)r=d.reply;}
    }catch(e){}
  }
  if(!r)r='Ich bin gerade noch nicht mit meinem KI-Schlüssel verbunden – bitte prüfe kurz, ob GEMINI_API_KEY in Vercel gespeichert ist.';
  msg.textContent=r;spk(r);
  tm=setTimeout(()=>{document.body.classList.remove('ans');st.textContent='Bereit'},9000);
}
trt.onclick=()=>dogs();ask.onclick=()=>{ans(inp.value);inp.value=''};inp.onkeypress=e=>{if(e.key==='Enter'){ans(inp.value);inp.value=''}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rc=new SR();rc.lang='de-DE';mic.onclick=()=>{mic.classList.add('on');mic.textContent='🔴 Hört zu...';rc.start()};rc.onresult=e=>ans(e.results[0][0].transcript);rc.onend=()=>{mic.classList.remove('on');mic.textContent='🎤 Reinsprechen'}}
</script>
</body>
</html>
