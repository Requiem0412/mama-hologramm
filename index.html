<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Hologramm-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.025) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 30;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all 0.3s ease;
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      text-align: center;
    }

    /* 3-Spalten-Bühne */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(260px, 1.15fr) minmax(340px, 640px) minmax(260px, 1.15fr);
      align-items: center;
      gap: 12px;
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
      padding: 4px 16px 24px;
      z-index: 20;
    }

    .holo-companion {
      position: relative;
      height: 72vh;
      min-height: 420px;
      max-height: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 46px;
      user-select: none;
      perspective: 900px;
    }

    .holo-avatar-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-style: preserve-3d;
      transform: translateY(14px) scale(0.94);
      transition: transform 0.4s ease;
      animation: holoSitFloat 4.2s ease-in-out infinite;
    }

    #sky-stage .holo-avatar-wrap {
      animation-delay: -2.1s;
    }

    @keyframes holoSitFloat {
      0%, 100% { transform: translateY(14px) scale(0.94) rotateZ(-0.5deg); }
      50% { transform: translateY(8px) scale(0.94) rotateZ(0.8deg); }
    }

    /* Wenn Leckerli: kurz aufstehen und mit dem Schwanz wedeln! */
    body.state-treat .holo-avatar-wrap {
      transform: translateY(-8px) scale(1.02) !important;
      animation: treatWag 0.15s ease-in-out infinite alternate !important;
    }

    @keyframes treatWag {
      0% { transform: translateY(-8px) scale(1.02) rotateZ(-4deg); }
      100% { transform: translateY(-14px) scale(1.05) rotateZ(4deg); }
    }

    .holo-dog-img {
      max-width: 100%;
      max-height: 94%;
      width: auto;
      height: 90%;
      object-fit: contain;
      object-position: bottom center;
      -webkit-mask-image: linear-gradient(to bottom, black 94%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 94%, transparent 100%);
      filter:
        drop-shadow(0 0 18px rgba(0, 243, 255, 0.55))
        drop-shadow(0 0 38px rgba(0, 160, 255, 0.25))
        contrast(1.05)
        saturate(1.08);
    }

    #sky-stage .holo-dog-img {
      transform: scale(1.05);
      transform-origin: bottom center;
    }

    .holo-scan-overlay {
      position: absolute;
      inset: 4% 8% 4%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.07) 4px
      );
      pointer-events: none;
      border-radius: 40%;
      mix-blend-mode: screen;
    }

    .holo-projector-ring {
      position: absolute;
      bottom: 36px;
      width: 220px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(0, 243, 255, 0.55);
      background: radial-gradient(ellipse at center, rgba(0, 243, 255, 0.28) 0%, transparent 72%);
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.45), inset 0 0 14px rgba(0, 243, 255, 0.35);
      pointer-events: none;
    }

    .pet-tag {
      position: absolute;
      bottom: 2px;
      background: rgba(4, 16, 34, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #dffbff;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.25);
    }

    /* Zentraler Hologramm-Kopf */
    .center-column {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .holo-center-stage {
      position: relative;
      width: 100%;
      height: 28vh;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 26px;
    }

    .holo-center-head {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(0, 243, 255, 0.4) 0%, rgba(0, 110, 255, 0.18) 60%, transparent 80%);
      border: 2px solid rgba(0, 243, 255, 0.65);
      box-shadow: 0 0 38px rgba(0, 243, 255, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: headFloat 3.8s ease-in-out infinite;
    }

    @keyframes headFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }

    .holo-center-head::before {
      content: "🤖";
      font-size: 54px;
      filter: drop-shadow(0 0 14px var(--cyan));
    }

    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .treat-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: 2px solid var(--amber);
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.25), rgba(255, 110, 0, 0.3));
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 22px rgba(255, 170, 0, 0.3);
      transition: all 0.2s ease;
    }

    .treat-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
    }

    .answer-card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }

    .answer-text {
      font-size: 17px;
      line-height: 1.55;
      color: #ffffff;
    }

    .text-row {
      display: flex;
      gap: 10px;
    }

    .text-row input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(0, 243, 255, 0.35);
      background: rgba(5, 15, 30, 0.9);
      color: #fff;
      font-size: 16px;
    }

    .text-row button {
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: var(--cyan);
      color: #02101d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 980px) {
      .stage-layout {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }
      .center-column { grid-column: 1 / -1; grid-row: 1; }
      #shiva-stage { grid-column: 1; grid-row: 2; height: 32vh; }
      #sky-stage { grid-column: 2; grid-row: 2; height: 32vh; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot" id="status-dot"></span>
      <span>Shiva & Sky • Hologramm</span>
    </div>
    <div class="status-pill" id="status-text">Bereit</div>
  </header>

  <div class="stage-layout">
    <!-- LINKS: SHIVA -->
    <div class="holo-companion" id="shiva-stage">
      <div class="holo-avatar-wrap">
        <img class="holo-dog-img" src="/shiva.png" alt="Shiva" />
        <div class="holo-scan-overlay"></div>
      </div>
      <div class="holo-projector-ring"></div>
      <div class="pet-tag">🐾 Shiva</div>
    </div>

    <!-- MITTE: KOPF & CHAT -->
    <div class="center-column">
      <div class="holo-center-stage">
        <div class="holo-center-head">
          <div class="holo-scan-overlay"></div>
        </div>
        <div class="holo-projector-ring"></div>
      </div>

      <main>
        <button type="button" class="treat-btn" id="treat-btn">
          <span>🦴</span>
          <span>Leckerli geben! (Aufstehen & Schwanz wedeln)</span>
        </button>

        <div class="answer-card">
          <div class="answer-text" id="answer-text">Shiva und Sky sitzen gemütlich auf ihren Ringen. Klicke auf den Leckerli-Button oder tippe unten „Leckerli“ ein!</div>
        </div>

        <form class="text-row" id="text-form">
          <input type="text" id="text-input" placeholder="Tippe z.B. „Leckerli“..." />
          <button type="submit">Senden</button>
        </form>
      </main>
    </div>

    <!-- RECHTS: SKY -->
    <div class="holo-companion" id="sky-stage">
      <div class="holo-avatar-wrap">
        <img class="holo-dog-img" src="/sky.png" alt="Sky" />
        <div class="holo-scan-overlay"></div>
      </div>
      <div class="holo-projector-ring"></div>
      <div class="pet-tag">🐾 Sky</div>
    </div>
  </div>

  <script>
    function giveTreat() {
      document.body.classList.add('state-treat');
      document.getElementById('status-text').textContent = 'Juhu, Leckerli! 🦴🐾';
      document.getElementById('answer-text').textContent = 'Shiva & Sky stehen auf, wedeln aufgeregt mit dem Schwanz und freuen sich riesig!';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance('Juhu, ein Leckerli! Vielen Dank!');
        utter.lang = 'de-DE';
        window.speechSynthesis.speak(utter);
      }

      setTimeout(() => {
        document.body.classList.remove('state-treat');
        document.getElementById('status-text').textContent = 'Bereit';
        document.getElementById('answer-text').textContent = 'Shiva & Sky sitzen wieder gemütlich auf ihren Ringen.';
      }, 5000);
    }

    document.getElementById('treat-btn').addEventListener('click', giveTreat);

    document.getElementById('text-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('text-input');
      const val = input.value.trim().toLowerCase();
      if (val.includes('leckerli') || val.includes('snack')) {
        giveTreat();
      } else {
        document.getElementById('answer-text').textContent = `Du hast geschrieben: „${input.value}“`;
      }
      input.value = '';
    });
  </script>
</body>
</html>
