<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Persönlicher KI-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Subtile Laser-Gitterlinien */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.025) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 20;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all 0.3s ease;
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      text-align: center;
    }

    .settings-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #d0e8ff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 3-Spalten-Bühne: Links Shiva • Mitte Chat • Rechts Sky */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(340px, 680px) minmax(220px, 1fr);
      align-items: center;
      gap: 12px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 4px 18px 28px;
      z-index: 20;
    }

    /* Hologramm-Kapseln für Shiva & Sky */
    .holo-companion {
      position: relative;
      height: 62vh;
      min-height: 360px;
      max-height: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .holo-companion:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .holo-companion canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 22px rgba(0, 243, 255, 0.35));
      transition: filter 0.3s ease;
    }

    .holo-companion.active-speaker canvas {
      filter: drop-shadow(0 0 32px rgba(0, 255, 136, 0.65));
    }

    .pet-tag {
      position: absolute;
      bottom: 10px;
      background: rgba(4, 16, 34, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #dffbff;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.25);
      transition: all 0.25s ease;
    }

    .holo-companion.active-speaker .pet-tag {
      border-color: var(--green);
      color: #ffffff;
      background: rgba(0, 75, 45, 0.88);
      box-shadow: 0 0 22px rgba(0, 255, 136, 0.45);
    }

    /* Hauptbedienung in der Mitte */
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mic-btn {
      width: 100%;
      padding: 20px 26px;
      border-radius: 20px;
      border: 2px solid var(--cyan);
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.22), rgba(0, 110, 255, 0.28));
      color: #ffffff;
      font-size: 23px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.28);
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .mic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.45);
    }

    .mic-btn.listening {
      border-color: var(--green);
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.28), rgba(0, 160, 90, 0.35));
      box-shadow: 0 0 42px rgba(0, 255, 136, 0.5);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .chip {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.28);
      color: #dff8ff;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .chip:hover {
      background: rgba(0, 243, 255, 0.16);
      border-color: var(--cyan);
    }

    .answer-card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }

    .question-echo {
      font-size: 15px;
      color: #8eeeff;
      margin-bottom: 8px;
      font-style: italic;
    }

    .answer-text {
      font-size: 19px;
      line-height: 1.58;
      color: #ffffff;
      white-space: pre-line;
      max-height: 30vh;
      overflow-y: auto;
    }

    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 140px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(0, 243, 255, 0.2);
      border-color: var(--cyan);
    }

    .text-row {
      display: flex;
      gap: 10px;
    }

    .text-row input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(0, 243, 255, 0.35);
      background: rgba(5, 15, 30, 0.9);
      color: #fff;
      font-size: 16px;
    }

    .text-row button {
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: var(--cyan);
      color: #02101d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #settings-box {
      display: none;
      background: rgba(4, 14, 28, 0.96);
      border: 1px solid var(--cyan);
      border-radius: 16px;
      padding: 18px;
      margin: 0 20px 12px;
      z-index: 30;
    }

    #settings-box label {
      display: block;
      font-size: 14px;
      color: #9eeeff;
      margin-bottom: 6px;
    }

    #settings-box select, #settings-box input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      background: #081a33;
      color: #fff;
      margin-bottom: 12px;
      font-size: 15px;
    }

    /* Tablet & Smartphone: Beide Hunde nebeneinander oben, Chat direkt darunter */
    @media (max-width: 980px) {
      header {
        flex-wrap: wrap;
        gap: 8px;
      }
      .status-pill {
        order: 3;
        width: 100%;
      }
      .stage-layout {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }
      #shiva-stage {
        grid-column: 1;
        grid-row: 1;
        height: 28vh;
        min-height: 210px;
      }
      #sky-stage {
        grid-column: 2;
        grid-row: 1;
        height: 28vh;
        min-height: 210px;
      }
      main {
        grid-column: 1 / -1;
        grid-row: 2;
      }
    }

    @media (max-width: 560px) {
      .chips { grid-template-columns: 1fr; }
      .mic-btn { font-size: 20px; padding: 16px; }
      .answer-text { font-size: 17px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot" id="status-dot"></span>
      <span>Shiva & Sky • Hologramm</span>
    </div>
    <div class="status-pill" id="status-text">Bereit • Tippe auf „Frage stellen“</div>
    <button class="settings-toggle" id="toggle-settings">⚙️ Stimme</button>
  </header>

  <div id="settings-box">
    <label for="voice-select">Deutsche Stimme auswählen:</label>
    <select id="voice-select"></select>
    <label for="fallback-key">Optionaler eigener Gemini-Key (nur nötig, falls kein Vercel-Server genutzt wird):</label>
    <input type="password" id="fallback-key" placeholder="AIzaSy... (auf Vercel automatisch aktiv)" />
  </div>

  <div class="stage-layout">
    <!-- LINKS: SHIVA -->
    <div class="holo-companion active-speaker" id="shiva-stage" title="Tippe auf Shiva">
      <canvas id="canvas-shiva"></canvas>
      <div class="pet-tag">🐾 Shiva</div>
    </div>

    <!-- MITTE: CHAT & STEUERUNG -->
    <main>
      <button class="mic-btn" id="mic-btn">
        <span>🎙️</span>
        <span id="mic-label">FRAGE STELLEN</span>
      </button>

      <div class="chips">
        <button class="chip" data-q="Wie backe ich einen richtig saftigen Marmorkuchen?">🍰 Saftiger Marmorkuchen</button>
        <button class="chip" data-q="Wie bekomme ich einen hartnäckigen Fleck am besten aus Kleidung raus?">🧺 Flecken-Hausmittel</button>
        <button class="chip" data-q="Was ist besser zum Braten: Butterschmalz oder Olivenöl?">🍳 Butterschmalz oder Olivenöl?</button>
        <button class="chip" data-q="Hast du eine schöne Geschenkidee für einen Geburtstag?">🎁 Schöne Geschenkidee</button>
      </div>

      <div class="answer-card" id="answer-card">
        <div class="question-echo" id="question-echo">Hallo! Shiva & Sky sind für dich da.</div>
        <div class="answer-text" id="answer-text">Frag uns einfach alles, was du wissen möchtest – Rezepte, Haushaltstipps, Vergleiche oder Ideen. Drücke dazu auf den großen Knopf oben oder tippe auf Shiva oder Sky!</div>
        <div class="card-actions">
          <button class="action-btn" id="replay-btn">🔊 Nochmal vorlesen</button>
          <button class="action-btn" id="stop-btn">⏹️ Vorlesen stoppen</button>
        </div>
      </div>

      <form class="text-row" id="text-form">
        <input type="text" id="text-input" placeholder="Oder hier eine Frage eintippen..." />
        <button type="submit">Fragen</button>
      </form>
    </main>

    <!-- RECHTS: SKY -->
    <div class="holo-companion" id="sky-stage" title="Tippe auf Sky">
      <canvas id="canvas-sky"></canvas>
      <div class="pet-tag">🐾 Sky</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';

    // --- 1. 3D-HOLOGRAMM-AVATARE FÜR SHIVA & SKY ---
    const pointer = { x: 0, y: 0 };
    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    function createDogHologram({ canvasId, imageUrl, phaseOffset, mouthY, eyeY, sideSign }) {
      const canvas = document.getElementById(canvasId);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
      camera.position.set(0, 0.05, 4.
