<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • 3D-Wireframe-Hologramm</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --pink: #ff3366;
      --bg: #02060f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 40%, #091d3a 0%, var(--bg) 80%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 24px;
      overflow-x: hidden;
    }

    /* Feines Hologramm-Scanline-Raster */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.035) 4px
      );
      pointer-events: none;
      z-index: 50;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto 10px;
    }

    .pill {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 8px 18px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 15px;
      color: var(--cyan);
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.15);
    }

    /* Große 3-Spalten-Bühne */
    .stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr 1.15fr;
      gap: 20px;
      max-width: 1540px;
      width: 100%;
      margin: auto;
      align-items: center;
      text-align: center;
    }

    .entity {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 54vh;
      min-height: 360px;
    }

    /* Große Drahtgitter-SVGs */
    .holo-svg {
      width: 100%;
      max-width: 380px;
      height: 100%;
      max-height: 400px;
      filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.65));
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: visible;
    }

    .head-svg {
      max-width: 320px;
      max-height: 340px;
      animation: floatHead 4s ease-in-out infinite;
    }

    @keyframes floatHead {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Drahtgitter-Stile */
    .wire-cyan {
      fill: rgba(0, 243, 255, 0.06);
      stroke: var(--cyan);
      stroke-width: 1.6;
      stroke-linejoin: round;
    }

    .wire-mesh {
      fill: none;
      stroke: rgba(0, 243, 255, 0.45);
      stroke-width: 1;
    }

    /* Markierte Gesichtshälften in Neon-Grün */
    .face-green {
      fill: rgba(0, 255, 136, 0.22);
      stroke: var(--green);
      stroke-width: 2;
      filter: drop-shadow(0 0 8px var(--green));
    }

    .face-cyan {
      fill: rgba(0, 243, 255, 0.08);
      stroke: var(--cyan);
      stroke-width: 1.6;
    }

    /* Augen, Schwanz & Zunge */
    .dog-eye {
      fill: var(--cyan);
      transition: all 0.25s ease;
    }

    .dog-tongue {
      fill: rgba(255, 51, 102, 0.45);
      stroke: var(--pink);
      stroke-width: 1.6;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .dog-tail {
      transform-origin: 85px 215px;
      transition: transform 0.2s ease;
    }

    .dog-body-group {
      transform-origin: 150px 260px;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Animation beim Winseln / Sprechen */
    body.whine .dog-body-group {
      transform: translateY(-22px) scaleY(1.07);
    }

    body.whine .dog-eye {
      fill: var(--pink);
      filter: drop-shadow(0 0 10px var(--pink));
    }

    body.whine .dog-tongue {
      opacity: 1;
    }

    body.whine .dog-tail {
      animation: wagTail 0.14s ease-in-out infinite alternate;
    }

    @keyframes wagTail {
      from { transform: rotate(-16deg); }
      to { transform: rotate(22deg); }
    }

    /* Schwebendes Herzchen */
    .heart {
      position: absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      font-size: 44px;
      filter: drop-shadow(0 0 16px var(--pink));
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }

    body.whine .heart {
      transform: translateX(-50%) scale(1.25);
      animation: heartBeat 0.55s ease-in-out infinite alternate;
    }

    @keyframes heartBeat {
      from { transform: translateX(-50%) scale(1.15); }
      to { transform: translateX(-50%) scale(1.4); }
    }

    .label {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 5px 16px;
      border-radius: 99px;
      background: rgba(4, 15, 32, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
    }

    .green-text {
      color: var(--green);
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }

    .cyan-text {
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
    }

    /* Steuerungszentrale unten */
    .panel {
      background: rgba(6, 18, 36, 0.92);
      border: 1px solid rgba(0, 243, 255, 0.45);
      border-radius: 20px;
      padding: 20px 24px;
      max-width: 760px;
      width: 100%;
      margin: 12px auto 4px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
    }

    #msg {
      font-size: 16px;
      color: #dff8ff;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(0, 243, 255, 0.45);
      background: #040c1a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.35);
    }

    button {
      padding: 14px 24px;
      border-radius: 12px;
      border: 2px solid var(--cyan);
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(0, 140, 255, 0.3));
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.02);
      box-shadow: 0 0 22px rgba(0, 243, 255, 0.45);
    }

    @media (max-width: 920px) {
      .stage { grid-template-columns: 1fr; }
      .entity { height: 34vh; min-height: 250px; }
      .row { flex-direction: column; }
    }
  </style>
</head>
