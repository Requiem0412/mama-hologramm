<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • 3D-Hologramm-Assistent</title>
  <!-- Three.js für echte 3D-Drahtgitter-Modelle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --pink: #ff3366;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      transition: all 0.3s ease;
    }

    body.is-whining .dot {
      background: var(--pink);
      box-shadow: 0 0 20px var(--pink);
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
    }

    /* 3-Spalten-Bühne für Shiva, Kopf, Sky */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(320px, 500px) minmax(260px, 1fr);
      align-items: center;
      gap: 16px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .holo-companion {
      position: relative;
      height: 62vh;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      background: rgba(5, 15, 30, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 20px;
      padding-bottom: 20px;
    }

    .canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Herzchen-Overlay über den Hunden */
    .heart-badge {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      font-size: 32px;
      filter: drop-shadow(0 0 12px var(--pink));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
    }

    body.is-whining .heart-badge {
      transform: translateX(-50%) scale(1.3);
      animation: pulseHeart 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulseHeart {
      0% { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1.4); }
    }

    .pet-tag {
      position: relative;
      z-index: 5;
      background: rgba(4, 16, 34, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #dffbff;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.25);
    }

    .center-column {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .holo-center-stage {
      position: relative;
      width: 100%;
      height: 28vh;
      min-height: 200px;
      background: rgba(5, 15, 30, 0.5);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    }

    p { font-size: 15px; line-height: 1.5; margin-bottom: 16px; color: #d0e8ff; }

    .treat-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(0, 160, 255, 0.3));
      color: #ffffff;
      border: 2px solid var(--cyan);
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
