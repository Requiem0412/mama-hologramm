<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persönlicher KI-Assistent • Hologramm</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 75%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.03) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 30;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all 0.3s ease;
    }

    .settings-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #d0e8ff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .settings-toggle:hover {
      background: rgba(0, 243, 255, 0.18);
      border-color: var(--cyan);
    }

    /* 3-Spalten-Bühne: Links Shiva • Mitte 3D-KI-Kopf & Chat • Rechts Sky */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(340px, 700px) minmax(220px, 1fr);
      align-items: center;
      gap: 14px;
      max-width: 1520px;
      width: 100%;
      margin: 0 auto;
      padding: 0 18px 28px;
      z-index: 20;
    }

    /* Begleiter links & rechts */
    .holo-companion {
      position: relative;
      height: 56vh;
      min-height: 320px;
      max-height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 44px;
      user-select: none;
    }

    .holo-avatar-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: holoFloat 4.2s ease-in-out infinite;
    }

    #sky-stage .holo-avatar-wrap {
      animation-delay: -2.1s;
    }

    @keyframes holoFloat {
      0%, 100% { transform: translateY(0px) rotateZ(-0.8deg); }
      50% { transform: translateY(-8px) rotateZ(1deg); }
    }

    .holo-dog-img {
      max-width: 95%;
      max-height: 92%;
      width: auto;
      height: 88%;
      object-fit: contain;
      object-position: bottom center;
      -webkit-mask-image: linear-gradient(to bottom, black 92%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 92%, transparent 100%);
      filter:
        drop-shadow(0 0 18px rgba(0, 243, 255, 0.45))
        drop-shadow(0 0 34px rgba(0, 160, 255, 0.2));
    }

    #sky-stage .holo-dog-img {
      transform: scale(1.06);
      transform-origin: bottom center;
    }

    .holo-projector-ring {
      position: absolute;
      bottom: 38px;
      width: 200px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(0, 243, 255, 0.5);
      background: radial-gradient(ellipse at center, rgba(0, 243, 255, 0.24) 0%, transparent 72%);
      box-shadow: 0 0 22px rgba(0, 243, 255, 0.4);
      pointer-events: none;
    }

    .pet-tag {
      position: absolute;
      bottom: 4px;
      background: rgba(4, 16, 34, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #dffbff;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }
