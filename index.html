<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persönlicher KI-Assistent • 3D Laser-Hologramm</title>
  <style>
    :root {
      --cyan: #18e8ff;
      --green: #10ff98;
      --amber: #ffbe3b;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 30%, #0b2447 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.025) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 30;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all 0.3s ease;
    }

    .settings-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #d0e8ff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .settings-toggle:hover {
      background: rgba(0, 243, 255, 0.18);
      border-color: var(--cyan);
    }

    /* 3-Spalten-Bühne: Links Shiva (Laser) • Mitte 3D-Kopf (Laser) & Chat • Rechts Sky (Laser) */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(230px, 1fr) minmax(340px, 700px) minmax(230px, 1fr);
      align-items: center;
      gap: 14px;
      max-width: 1540px;
      width: 100%;
      margin: 0 auto;
      padding: 0 18px 28px;
      z-index: 20;
    }

    /* Laser-Hologramm-Kapseln für Shiva & Sky */
    .holo-companion {
      position: relative;
      height: 60vh;
      min-height: 350px;
      max-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 36px;
      user-select: none;
    }

    .holo-companion canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 24px rgba(24, 232, 255, 0.45));
    }

    .pet-tag {
      position: absolute;
      bottom: 4px;
      background: rgba(4, 16, 34, 0.9);
      border: 1px solid rgba(24, 232, 255, 0.45);
      color: #dffbff;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 0 18px rgba(24, 232, 255, 0.25);
    }

    .center-column {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #canvas-wrap {
      position: relative;
      width: 100%;
      height: 39vh;
      min-height: 270px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #holo-canvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 26px rgba(24, 232, 255, 0.45));
    }

    .status-pill {
      position: absolute;
      bottom: 8px;
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(24, 232, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
      box-shadow: 0 0 20px rgba(24, 232, 255, 0.2);
      text-align: center;
    }

    main {
      width: 100%;
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 25;
    }

    .mic-btn {
      width: 100%;
      padding: 18px 24px;
      border-radius: 20px;
      border: 2px solid var(--cyan);
      background: linear-gradient(135deg, rgba(24, 232, 255, 0.22), rgba(0, 110, 255, 0.28));
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 0 30px rgba(24, 232, 255, 0.28);
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .mic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(24, 232, 255, 0.45);
    }

    .mic-btn.listening {
      border-color: var(--green);
      background: linear-gradient(135deg, rgba(16, 255, 152, 0.28), rgba(0, 160, 90, 0.35));
      box-shadow: 0 0 42px rgba(16, 255, 152, 0.5);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .chip {
      background: var(--panel);
      border: 1px solid rgba(24, 232, 255, 0.28);
      color: #dff8ff;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .chip:hover {
      background: rgba(24, 232, 255, 0.16);
      border-color: var(--cyan);
    }

    .answer-card {
      background: var(--panel);
      border: 1px solid rgba(24, 232, 255, 0.4);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }

    .question-echo {
      font-size: 15px;
      color: #8eeeff;
      margin-bottom: 8px;
      font-style: italic;
    }

    .answer-text {
      font-size: 18px;
      line-height: 1.55;
      color: #ffffff;
      white-space: pre-line;
      max-height: 23vh;
      overflow-y: auto;
    }

    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 140px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(24, 232, 255, 0.2);
      border-color: var(--cyan);
    }

    .text-row {
      display: flex;
      gap: 10px;
    }

    .text-row input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(24, 232, 255, 0.35);
      background: rgba(5, 15, 30, 0.9);
      color: #fff;
      font-size: 16px;
    }

    .text-row button {
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: var(--cyan);
      color: #02101d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #settings-box {
      display: none;
      background: rgba(4, 14, 28, 0.96);
      border: 1px solid var(--cyan);
      border-radius: 16px;
      padding: 18px;
      margin: 0 20px 12px;
      z-index: 35;
      position: relative;
    }

    #settings-box label {
      display: block;
      font-size: 14px;
      color: #9eeeff;
      margin-bottom: 6px;
    }

    #settings-box select, #settings-box input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(24, 232, 255, 0.4);
      background: #081a33;
      color: #fff;
      margin-bottom: 12px;
      font-size: 15px;
    }

    @media (max-width: 980px) {
      .stage-layout {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }
      .center-column {
        grid-column: 1 / -1;
        grid-row: 1;
      }
      #shiva-stage {
        grid-column: 1;
        grid-row: 2;
        height: 28vh;
        min-height: 200px;
      }
      #sky-stage {
        grid-column: 2;
        grid-row: 2;
        height: 28vh;
        min-height: 200px;
      }
    }

    @media (max-width: 600px) {
      .chips { grid-template-columns: 1fr; }
      .mic-btn { font-size: 20px; padding: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot" id="status-dot"></span>
      <span>Hologramm-Assistent</span>
    </div>
    <button type="button" class="settings-toggle" id="toggle-settings">⚙️ Stimme & Key</button>
  </header>

  <div id="settings-box">
    <label for="voice-select">Deutsche Stimme auswählen:</label>
    <select id="voice-select"></select>
    <label for="fallback-key">Optionaler eigener Gemini-Key (falls nicht auf Vercel hinterlegt):</label>
    <input type="password" id="fallback-key" placeholder="AIzaSy..." />
  </div>

  <div class="stage-layout">
    <!-- LINKS: SHIVA ALS REINES LASER-HOLOGRAMM -->
    <div class="holo-companion" id="shiva-stage">
      <canvas id="canvas-shiva"></canvas>
      <div class="pet-tag">🐾 Shiva</div>
    </div>

    <!-- MITTE: LASER-HOLOGRAMM-KOPF + BEDIENUNG -->
    <div class="center-column">
      <div id="canvas-wrap">
        <canvas id="holo-canvas"></canvas>
        <div class="status-pill" id="status-text">Bereit • Tippe unten auf „Frage stellen“</div>
      </div>

      <main>
        <button type="button" class="mic-btn" id="mic-btn">
          <span>🎙️</span>
          <span id="mic-label">FRAGE STELLEN</span>
        </button>

        <div class="chips">
          <button type="button" class="chip" data-q="Wie backe ich einen richtig saftigen Marmorkuchen?">🍰 Saftiger Marmorkuchen</button>
          <button type="button" class="chip" data-q="Wie bekomme ich einen hartnäckigen Fleck am besten aus Kleidung raus?">🧺 Flecken-Hausmittel</button>
          <button type="button" class="chip" data-q="Was ist besser zum Braten: Butterschmalz oder Olivenöl?">🍳 Butterschmalz oder Olivenöl?</button>
          <button type="button" class="chip" data-q="Hast du eine schöne Geschenkidee für einen Geburtstag?">🎁 Schöne Geschenkidee</button>
        </div>

        <div class="answer-card" id="answer-card">
          <div class="question-echo" id="question-echo">Hallo! Ich bin dein persönlicher Hologramm-Helfer.</div>
          <div class="answer-text" id="answer-text">Frag mich einfach alles, was du wissen möchtest – zum Beispiel Rezepte, Haushaltstipps, Vergleiche oder Ideen. Drücke dazu einfach auf den großen Knopf oben!</div>
          <div class="card-actions">
            <button type="button" class="action-btn" id="replay-btn">🔊 Nochmal vorlesen</button>
            <button type="button" class="action-btn" id="stop-btn">⏹️ Vorlesen stoppen</button>
          </div>
        </div>

        <form class="text-row" id="text-form">
          <input type="text" id="text-input" placeholder="Oder hier eine Frage eintippen..." />
          <button type="submit">Fragen</button>
        </form>
      </main>
    </div>

    <!-- RECHTS: SKY ALS REINES LASER-HOLOGRAMM -->
    <div class="holo-companion" id="sky-stage">
      <canvas id="canvas-sky"></canvas>
      <div class="pet-tag">🐾 Sky</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';

    // --- 1. LASER-HOLOGRAMM-ENGINE FÜR SHIVA & SKY (IM SELBEN STIL WIE DER KOPF) ---
    function createLaserDog({ canvasId, imageUrl, phaseOffset, scaleBoost, sideSign }) {
      const canvas = document.getElementById(canvasId);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
      camera.position.set(0, 0.02, 4.4);

      const group = new THREE.Group();
      scene.add(group);

      const uniforms = {
        uMap: { value: null },
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x18e8ff) },
        uAccent: { value: new THREE.Color(0x9cfaff) },
        uTexel: { value: new THREE.Vector2(1 / 512, 1 / 512) }
      };

      // Shader wandelt das Hundebild in echtes, halbtransparentes Laser-Hologramm-Licht um
      const laserDogMat = new THREE.ShaderMaterial({
        uniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          varying vec2 vUv;
          uniform float uTime;
          void main() {
            vUv = uv;
            vec3 pos = position;
            // Leichte 3D-Wölbung & sanftes Atmen
            float centerDist = length((uv - vec2(0.5, 0.55)) * vec2(1.2, 0.9));
            pos.z += smoothstep(0.65, 0.0, centerDist) * 0.22;
            float chest = smoothstep(0.55, 0.05, uv.y);
            pos.y += sin(uTime * 2.0) * 0.015 * chest;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform sampler2D uMap;
          uniform float uTime;
          uniform vec3 uColor;
          uniform vec3 uAccent;
          uniform vec2 uTexel;

          float getLuma(vec3 c) {
            return dot(c, vec3(0.299, 0.587, 0.114));
          }

          void main() {
            vec4 tex = texture2D(uMap, vUv);
            if (tex.a < 0.06) discard;

            // Konturen-Erkennung (Sobel-artig) für leuchtende Laser-Linien um Fell, Augen & Schnauze
            float lC = getLuma(tex.rgb);
            float lR = getLuma(texture2D(uMap, vUv + vec2(uTexel.x * 2.0, 0.0)).rgb);
            float lL = getLuma(texture2D(uMap, vUv - vec2(uTexel.x * 2.0, 0.0)).rgb);
            float lU = getLuma(texture2D(uMap, vUv + vec2(0.0, uTexel.y * 2.0)).rgb);
            float lD = getLuma(texture2D(uMap, vUv - vec2(0.0, uTexel.y * 2.0)).rgb);
            float edge = clamp((abs(lR - lL) + abs(lU - lD)) * 2.6, 0.0, 1.0);

            // Äußerer Silhouette-Glow
            float aR = texture2D(uMap, vUv + vec2(uTexel.x * 4.0, 0.0)).a;
            float aL = texture2D(uMap, vUv - vec2(uTexel.x * 4.0, 0.0)).a;
            float aU = texture2D(uMap, vUv + vec2(0.0, uTexel.y * 4.0)).a;
            float aD = texture2D(uMap, vUv - vec2(0.0, uTexel.y * 4.0)).a;
            float rim = clamp(1.0 - (aR * aL * aU * aD), 0.0, 1.0);

            // Feines Laser-Gitter & Scanlines (identisch zum Kopf in der Mitte)
            float scanlines = 0.76 + 0.24 * sin(vUv.y * 190.0 - uTime * 4.5);
            float grid = 0.88 + 0.12 * sin(vUv.x * 130.0) * sin(vUv.y * 130.0);
            float pulseWave = 0.90 + 0.10 * sin(vUv.y * 16.0 - uTime * 2.5);

            // Helligkeit so aufbereiten, dass dunkles Fell (Sky) & helles Fell (Shiva) beide klar leuchten
            float bodyLight = 0.28 + pow(lC, 0.72) * 0.55;
            float intensity = clamp((bodyLight + edge * 0.65 + rim * 0.55) * scanlines * grid * pulseWave, 0.0, 1.15);

            vec3 col = mix(uColor, uAccent, clamp(edge * 0.85 + rim * 0.65 + lC * 0.35, 0.0, 1.0));
            float bottomFade = smoothstep(0.0, 0.06, vUv.y);
            float alpha = clamp(tex.a * (0.24 + intensity * 0.62) * bottomFade, 0.0, 0.92);

            gl_FragColor = vec4(col * (0.75 + intensity * 0.55), alpha);
          }
        `
      });

      const planeGeo = new THREE.PlaneGeometry(2.1, 2.5, 36, 36);
      const dogMesh = new THREE.Mesh(planeGeo, laserDogMat);
      dogMesh.position.y = 0.02;
      group.add(dogMesh);

      // Schwebende Hologramm-Lichtpartikel um den Hund
      const pCount = 45;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = 0.65 + Math.random() * 0.45;
        pPos[i * 3] = Math.cos(ang) * rad;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * 2.1;
        pPos[i * 3 + 2] = Math.sin(ang) * rad;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({
        color: 0x4df5ff,
        size: 0.028,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending
      });
      const particles = new THREE.Points(pGeo, pMat);
      scene.add(particles);

      // Doppelte Laser-Projektor-Ringe + Lichtkegel unter den Pfoten
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x18e8ff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending
      });
      const r1 = new THREE.Mesh(new THREE.RingGeometry(0.68, 0.74, 64), ringMat);
      r1.rotation.x = Math.PI / 2;
      r1.position.y = -1.18;
      scene.add(r1);

      const r2 = new THREE.Mesh(new THREE.RingGeometry(0.88, 0.91, 64), ringMat);
      r2.rotation.x = Math.PI / 2;
      r2.position.y = -1.21;
      scene.add(r2);

      const beamMat = new THREE.MeshBasicMaterial({
        color: 0x18e8ff,
        transparent: true,
        opacity: 0.08,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const beam = new THREE.Mesh(new THREE.ConeGeometry(0.88, 1.25, 48, 1, true), beamMat);
      beam.position.y = -0.58;
      scene.add(beam);

      // Bild laden & als HTML-Image
