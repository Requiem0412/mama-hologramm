<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiva & Sky • Persönlicher KI-Assistent</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --green: #00ff88;
      --amber: #ffaa00;
      --bg: #030812;
      --panel: rgba(8, 22, 42, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 35%, #0a1f3d 0%, var(--bg) 78%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Subtile Laser-Gitterlinien */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.025) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      z-index: 20;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all 0.3s ease;
    }

    .status-pill {
      background: rgba(3, 12, 26, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.45);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      color: #e6fbff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      text-align: center;
    }

    .settings-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #d0e8ff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 3-Spalten-Bühne: Links Shiva • Mitte Chat • Rechts Sky */
    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(230px, 1fr) minmax(340px, 660px) minmax(230px, 1fr);
      align-items: center;
      gap: 16px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 20px 28px;
      z-index: 20;
    }

    /* Hologramm-Bühne für Shiva & Sky */
    .holo-companion {
      position: relative;
      height: 58vh;
      min-height: 340px;
      max-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 48px;
      cursor: pointer;
      user-select: none;
      perspective: 900px;
    }

    .holo-avatar-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      animation: holoFloat 4.2s ease-in-out infinite;
    }

    #sky-stage .holo-avatar-wrap {
      animation-delay: -2.1s;
    }

    @keyframes holoFloat {
      0%, 100% { transform: translateY(0px) rotateZ(-1deg); }
      50% { transform: translateY(-10px) rotateZ(1.2deg); }
    }

    /* Neugieriges Kopfneigen beim Zuhören */
    body.state-listening .holo-avatar-wrap {
      animation: headTiltListen 2.2s ease-in-out infinite;
    }

    @keyframes headTiltListen {
      0%, 100% { transform: rotateZ(5deg) scale(1.03); }
      50% { transform: rotateZ(8deg) scale(1.05); }
    }

    /* Lebendiges Sprechen / Wippen im Takt der Stimme */
    .holo-companion.active-speaker.is-speaking .holo-avatar-wrap {
      animation: speakBounce 0.34s ease-in-out infinite alternate;
    }

    @keyframes speakBounce {
      0% { transform: translateY(0px) scaleY(1) scaleX(1); }
      100% { transform: translateY(-6px) scaleY(1.035) scaleX(0.985); }
    }

    .holo-dog-img {
      max-width: 92%;
      max-height: 88%;
      width: auto;
      height: 85%;
      object-fit: contain;
      border-radius: 24px;
      -webkit-mask-image: linear-gradient(to bottom, black 78%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 78%, transparent 100%);
      filter:
        drop-shadow(0 0 18px rgba(0, 243, 255, 0.55))
        drop-shadow(0 0 38px rgba(0, 160, 255, 0.25))
        contrast(1.05)
        saturate(1.08);
      transition: filter 0.3s ease, transform 0.2s ease;
    }

    .holo-companion.active-speaker .holo-dog-img {
      filter:
        drop-shadow(0 0 24px rgba(0, 255, 136, 0.72))
        drop-shadow(0 0 46px rgba(0, 243, 255, 0.35))
        contrast(1.08)
        saturate(1.12);
    }

    /* Subtile Hologramm-Scanlines über den Hunden */
    .holo-scan-overlay {
      position: absolute;
      inset: 8% 12% 14%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 243, 255, 0.08) 4px
      );
      pointer-events: none;
      border-radius: 50%;
      mix-blend-mode: screen;
    }

    /* Leuchtender Projektor-Ring am Boden unter jedem Hund */
    .holo-projector-ring {
      position: absolute;
      bottom: 44px;
      width: 190px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(0, 243, 255, 0.55);
      background: radial-gradient(ellipse at center, rgba(0, 243, 255, 0.28) 0%, transparent 72%);
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.45), inset 0 0 14px rgba(0, 243, 255, 0.35);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .holo-companion.active-speaker .holo-projector-ring {
      border-color: rgba(0, 255, 136, 0.75);
      background: radial-gradient(ellipse at center, rgba(0, 255, 136, 0.34) 0%, transparent 72%);
      box-shadow: 0 0 28px rgba(0, 255, 136, 0.55), inset 0 0 16px rgba(0, 255, 136, 0.4);
    }

    .pet-tag {
      position: absolute;
      bottom: 6px;
      background: rgba(4, 16, 34, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.45);
      color: #dffbff;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.25);
      transition: all 0.25s ease;
      z-index: 5;
    }

    .holo-companion.active-speaker .pet-tag {
      border-color: var(--green);
      color: #ffffff;
      background: rgba(0, 75, 45, 0.9);
      box-shadow: 0 0 22px rgba(0, 255, 136, 0.45);
    }

    /* Hauptbedienung in der Mitte */
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mic-btn {
      width: 100%;
      padding: 20px 26px;
      border-radius: 20px;
      border: 2px solid var(--cyan);
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.22), rgba(0, 110, 255, 0.28));
      color: #ffffff;
      font-size: 23px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.28);
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .mic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.45);
    }

    .mic-btn.listening {
      border-color: var(--green);
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.28), rgba(0, 160, 90, 0.35));
      box-shadow: 0 0 42px rgba(0, 255, 136, 0.5);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .chip {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.28);
      color: #dff8ff;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .chip:hover {
      background: rgba(0, 243, 255, 0.16);
      border-color: var(--cyan);
    }

    .answer-card {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }

    .question-echo {
      font-size: 15px;
      color: #8eeeff;
      margin-bottom: 8px;
      font-style: italic;
    }

    .answer-text {
      font-size: 19px;
      line-height: 1.58;
      color: #ffffff;
      white-space: pre-line;
      max-height: 30vh;
      overflow-y: auto;
    }

    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 140px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(0, 243, 255, 0.2);
      border-color: var(--cyan);
    }

    .text-row {
      display: flex;
      gap: 10px;
    }

    .text-row input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(0, 243, 255, 0.35);
      background: rgba(5, 15, 30, 0.9);
      color: #fff;
      font-size: 16px;
    }

    .text-row button {
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: var(--cyan);
      color: #02101d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #settings-box {
      display: none;
      background: rgba(4, 14, 28, 0.96);
      border: 1px solid var(--cyan);
      border-radius: 16px;
      padding: 18px;
      margin: 0 20px 12px;
      z-index: 30;
    }

    #settings-box label {
      display: block;
      font-size: 14px;
      color: #9eeeff;
      margin-bottom: 6px;
    }

    #settings-box select, #settings-box input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      background: #081a33;
      color: #fff;
      margin-bottom: 12px;
      font-size: 15px;
    }

    /* Tablet & Smartphone: Beide Hunde nebeneinander oben, Chat direkt darunter */
    @media (max-width: 980px) {
      header {
        flex-wrap: wrap;
        gap: 8px;
      }
      .status-pill {
        order: 3;
        width: 100%;
      }
      .stage-layout {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }
      #shiva-stage {
        grid-column: 1;
        grid-row: 1;
        height: 28vh;
        min-height: 210px;
      }
      #sky-stage {
        grid-column: 2;
        grid-row: 1;
        height: 28vh;
        min-height: 210px;
      }
      main {
        grid-column: 1 / -1;
        grid-row: 2;
      }
    }

    @media (max-width: 560px) {
      .chips { grid-template-columns: 1fr; }
      .mic-btn { font-size: 20px; padding: 16px; }
      .answer-text { font-size: 17px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot" id="status-dot"></span>
      <span>Shiva & Sky • Hologramm</span>
    </div>
    <div class="status-pill" id="status-text">Bereit • Tippe auf „Frage stellen“</div>
    <button class="settings-toggle" id="toggle-settings">⚙️ Stimme</button>
  </header>

  <div id="settings-box">
    <label for="voice-select">Deutsche Stimme auswählen:</label>
    <select id="voice-select"></select>
    <label for="fallback-key">Optionaler eigener Gemini-Key (nur nötig, falls kein Vercel-Server genutzt wird):</label>
    <input type="password" id="fallback-key" placeholder="AIzaSy... (auf Vercel automatisch aktiv)" />
  </div>

  <div class="stage-layout">
    <!-- LINKS: SHIVA -->
    <div class="holo-companion active-speaker" id="shiva-stage" title="Tippe auf Shiva">
      <div class="holo-avatar-wrap" id="shiva-wrap">
        <img class="holo-dog-img" src="/shiva.png" alt="Shiva Hologramm" />
        <div class="holo-scan-overlay"></div>
      </div>
      <div class="holo-projector-ring"></div>
      <div class="pet-tag">🐾 Shiva</div>
    </div>

    <!-- MITTE: CHAT & STEUERUNG -->
    <main>
      <button class="mic-btn" id="mic-btn">
        <span>🎙️</span>
        <span id="mic-label">FRAGE STELLEN</span>
      </button>

      <div class="chips">
        <button class="chip" data-q="Wie backe ich einen richtig saftigen Marmorkuchen?">🍰 Saftiger Marmorkuchen</button>
        <button class="chip" data-q="Wie bekomme ich einen hartnäckigen Fleck am besten aus Kleidung raus?">🧺 Flecken-Hausmittel</button>
        <button class="chip" data-q="Was ist besser zum Braten: Butterschmalz oder Olivenöl?">🍳 Butterschmalz oder Olivenöl?</button>
        <button class="chip" data-q="Hast du eine schöne Geschenkidee für einen Geburtstag?">🎁 Schöne Geschenkidee</button>
      </div>

      <div class="answer-card" id="answer-card">
        <div class="question-echo" id="question-echo">Hallo! Shiva & Sky sind für dich da.</div>
        <div class="answer-text" id="answer-text">Frag uns einfach alles, was du wissen möchtest – Rezepte, Haushaltstipps, Vergleiche oder Ideen. Drücke dazu auf den großen Knopf oben oder tippe auf Shiva oder Sky!</div>
        <div class="card-actions">
          <button class="action-btn" id="replay-btn">🔊 Nochmal vorlesen</button>
          <button class="action-btn" id="stop-btn">⏹️ Vorlesen stoppen</button>
        </div>
      </div>

      <form class="text-row" id="text-form">
        <input type="text" id="text-input" placeholder="Oder hier eine Frage eintippen..." />
        <button type="submit">Fragen</button>
      </form>
    </main>

    <!-- RECHTS: SKY -->
    <div class="holo-companion" id="sky-stage" title="Tippe auf Sky">
      <div class="holo-avatar-wrap" id="sky-wrap">
        <img class="holo-dog-img" src="/sky.png" alt="Sky Hologramm" />
        <div class="holo-scan-overlay"></div>
      </div>
      <div class="holo-projector-ring"></div>
      <div class="pet-tag">🐾 Sky</div>
    </div>
  </div>

  <script>
    // --- 1. 3D-PARALLAX & SPRECHER-AUSWAHL ---
    let appState = 'idle'; // 'idle' | 'listening' | 'thinking' | 'speaking'
    let activeSpeaker = 'shiva'; // 'shiva' | 'sky'

    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const shivaStage = document.getElementById('shiva-stage');
    const skyStage = document.getElementById('sky-stage');
    const shivaWrap = document.getElementById('shiva-wrap');
    const skyWrap = document.getElementById('sky-wrap');

    // Sanftes 3D-Mitdrehen zur Maus
    window.addEventListener('pointermove', (e) => {
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      shivaWrap.style.transform = `rotateY(${nx * 12 + 6}deg) rotateX(${-ny * 8}deg)`;
      skyWrap.style.transform = `rotateY(${nx * 12 - 6}deg) rotateX(${-ny * 8}deg)`;
    });

    function selectSpeaker(who) {
      activeSpeaker = who;
      shivaStage.classList.toggle('active-speaker', who === 'shiva');
      skyStage.classList.toggle('active-speaker', who === 'sky');
    }

    shivaStage.addEventListener('click', () => {
      selectSpeaker('shiva');
      statusText.textContent = 'Shiva hört dir aufmerksam zu 🐾';
    });

    skyStage.addEventListener('click', () => {
      selectSpeaker('sky');
      statusText.textContent = 'Sky hört dir aufmerksam zu 🐾';
    });

    function setState(newState, label) {
      appState = newState;
      if (label) statusText.textContent = label;

      document.body.classList.toggle('state-listening', newState === 'listening');
      shivaStage.classList.toggle('is-speaking', newState === 'speaking');
      skyStage.classList.toggle('is-speaking', newState === 'speaking');

      const css = newState === 'listening' ? '#00ff88' : newState === 'thinking' ? '#ffaa00' : '#00f3ff';
      statusDot.style.background = css;
      statusDot.style.boxShadow = `0 0 12px ${css}`;
    }

    // --- 2. DEUTSCHE SPRACHAUSGABE (TEXT-TO-SPEECH) ---
    const voiceSelect = document.getElementById('voice-select');
    let voices = [];

    function loadVoices() {
      voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('de'));
      if (voices.length === 0) voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = voices
        .map((v, i) => `<option value="${i}">${v.name} (${v.lang})</option>`)
        .join('');
    }
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;

    let lastSpokenText = document.getElementById('answer-text').textContent;

    function speak(text) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#_`]/g, '');
      lastSpokenText = cleanText;

      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = 'de-DE';
      utter.rate = 0.96;
      utter.pitch = activeSpeaker === 'shiva' ? 1.05 : 0.95;

      const chosen = voices[voiceSelect.value];
      if (chosen) utter.voice = chosen;

      const name = activeSpeaker === 'shiva' ? 'Shiva' : 'Sky';
      utter.onstart = () => setState('speaking', `${name} erklärt es dir...`);
      utter.onend = () => {
        setState('idle', 'Bereit für deine nächste Frage');
        selectSpeaker(activeSpeaker === 'shiva' ? 'sky' : 'shiva');
      };
      utter.onerror = () => setState('idle', 'Bereit für deine nächste Frage');

      window.speechSynthesis.speak(utter);
    }

    document.getElementById('replay-btn').addEventListener('click', () => speak(lastSpokenText));
    document.getElementById('stop-btn').addEventListener('click', () => {
      window.speechSynthesis.cancel();
      setState('idle', 'Vorlesen gestoppt • Bereit');
    });

    // --- 3. KI-ANTWORT HOLEN ---
    const fallbackInput = document.getElementById('fallback-key');
    fallbackInput.value = localStorage.getItem('holo_gemini_key') || '';
    fallbackInput.addEventListener('change', () => {
      localStorage.setItem('holo_gemini_key', fallbackInput.value.trim());
    });

    async function askAssistant(question) {
      if (!question.trim()) return;
      window.speechSynthesis.cancel();

      document.getElementById('question-echo').textContent = `Deine Frage: „${question}“`;
      document.getElementById('answer-text').textContent = 'Einen kleinen Moment, wir überlegen kurz...';
      setState('thinking', 'Shiva & Sky überlegen kurz...');

      try {
        let reply = '';
        const localKey = fallbackInput.value.trim();

        if (localKey) {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(localKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: {
                parts: [{ text: 'Du bist ein herzlicher, geduldiger deutscher Alltags-Assistent. Erkläre Rezepte, Haushaltstipps, Vergleiche und Empfehlungen klar, freundlich, gut strukturiert und ohne Fachchinesisch, sodass man es angenehm vorlesen und leicht nachmachen kann.' }]
              },
              contents: [{ parts: [{ text: question }] }]
            })
          });
          const data = await res.json();
          reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Entschuldige, da ist gerade etwas schiefgelaufen.';
        } else {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Serverfehler');
          reply = data.answer;
        }

        document.getElementById('answer-text').textContent = reply;
        speak(reply);
      } catch (err) {
        const msg = 'Hoppla, wir konnten gerade keine Verbindung aufbauen. Bitte prüfe kurz die Internetverbindung oder den API-Schlüssel.';
        document.getElementById('answer-text').textContent = msg;
        setState('idle', 'Verbindungsproblem');
      }
    }

    // --- 4. MIKROFON & SCHNELLWAHL ---
    const micBtn = document.getElementById('mic-btn');
    const micLabel = document.getElementById('mic-label');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.interimResults = false;

      micBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        try {
          recognition.start();
          micBtn.classList.add('listening');
          micLabel.textContent = 'WIR HÖREN ZU...';
          setState('listening', 'Wir hören dir zu – sprich einfach los!');
        } catch (e) {}
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        askAssistant(transcript);
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
        micLabel.textContent = 'FRAGE STELLEN';
        if (appState === 'listening') setState('idle', 'Bereit • Tippe auf „Frage stellen“');
      };

      recognition.onerror = () => {
        micBtn.classList.remove('listening');
        micLabel.textContent = 'FRAGE STELLEN';
        setState('idle', 'Mikrofon nicht erkannt – nutze gerne das Textfeld unten');
      };
    } else {
      micBtn.addEventListener('click', () => {
        alert('Dieser Browser unterstützt leider keine direkte Spracheingabe. Nutze gerne Chrome/Safari oder das Eingabefeld unten!');
      });
    }

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => askAssistant(btn.dataset.q));
    });

    document.getElementById('text-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('text-input');
      askAssistant(input.value);
      input.value = '';
    });

    document.getElementById('toggle-settings').addEventListener('click', () => {
      const box = document.getElementById('settings-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    });
  </script>
</body>
</html>
